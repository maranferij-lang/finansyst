<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Фінансист</title>
<meta name="description" content="Фінансист для комп'ютера: конверти для ФОПа, розподіл кожного надходження, прогноз касового розриву і овердрафт банку-партнера.">
<meta name="theme-color" content="#F4F4F2">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Кольори винесені в токени: палітру команди дизайну підставляємо тут */
:root{
  --bg:#F4F4F2; --side:#FAFAF9; --surface:#FFFFFF; --surface-2:#F0F1EE; --ink:#141614; --muted:#6A706C; --faint:#A2A7A3; --line:#E5E7E3;
  --accent:#1E8C5A; --accent-ink:#FFFFFF; --accent-soft:#E2F1E9;
  --crit:#D03E30; --crit-soft:#FAE6E3; --warn:#B86E17; --warn-soft:#F9EEDD; --ok:#1E8C5A;
  --c-tax:#E0A23B; --c-buy:#3C78E8; --c-exp:#8460DE; --c-res:#1FA090; --c-self:#DB5C83; --pending:#C9CCC8;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E100F; --side:#121513; --surface:#171A18; --surface-2:#1F2320; --ink:#ECEFEC; --muted:#8F9792; --faint:#5C635F; --line:#262B28;
  --accent:#3FB57C; --accent-ink:#04110A; --accent-soft:#163122;
  --crit:#EE7466; --crit-soft:#3A1F1C; --warn:#E39E52; --warn-soft:#33261A; --ok:#3FB57C;
  --c-tax:#E7B157; --c-buy:#6D9BF2; --c-exp:#A88AEE; --c-res:#43BFAE; --c-self:#EA81A2; --pending:#3A403C; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
.btn:disabled{background:var(--surface-2);color:var(--muted);opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:20px 12px 16px;background:var(--side);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand img{width:28px;height:28px;border-radius:8px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:14.5px;text-align:left;color:var(--muted);font-weight:500}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.demo{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.demo-h{display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-size:12.5px;color:var(--muted);font-weight:600}
.jsteps{display:flex;flex-direction:column;gap:1px}
.jstep{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:center;border:0;background:none;border-radius:8px;padding:5px 8px;text-align:left;font-size:13.5px}
.jstep:hover{background:var(--surface-2)}
.jstep .n{width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.jstep.done{color:var(--muted)}
.jstep.done .n{background:var(--accent);color:var(--accent-ink)}
.jstep.next .n{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);background:var(--surface)}
.jstep.now{background:var(--surface-2)}
.mode{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;font-size:12.5px;margin:0 8px 4px;align-self:flex-start}
.mode button{border:0;background:none;padding:3px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.mode button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px}
.linkbtn{border:0;background:none;padding:5px 8px;color:var(--accent);font-weight:500;font-size:13.5px;text-align:left;text-decoration:none;border-radius:8px}
.linkbtn.mut{color:var(--muted)}
.demo.collapsed .jsteps,.demo.collapsed .mode,.demo.collapsed #reset,.demo.collapsed #first,.demo.collapsed #stmt,.demo.collapsed .tcard{display:none}
.tcard{font-size:12.5px;color:var(--muted);padding:2px 8px;line-height:1.45}
.tcard b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.main{min-width:0;padding:22px 32px 60px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.hd h1{margin:0;font-weight:600;font-size:24px;letter-spacing:-.02em}
.hd-r{display:flex;align-items:center;gap:8px}
.datechip{font-size:13.5px;color:var(--muted);margin-right:6px}
.icbtn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;position:relative;color:var(--ink)}
.icbtn:hover{background:var(--surface-2)}
.icbtn svg{width:20px;height:20px}
.icbtn .badge{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--bg)}
.me{display:flex;align-items:center;gap:9px;border:0;background:none;padding:4px 8px 4px 4px;border-radius:12px;text-align:left}
.me:hover{background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.me .nm{display:block;font-size:14px;font-weight:600;line-height:1.15}
.me .sb2{display:block;font-size:12px;color:var(--muted);line-height:1.2}

.view.enter{animation:fade .25s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.card{background:var(--surface);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.ct .sub{color:var(--muted);font-weight:400;font-size:13px}
.ct>svg{width:19px;height:19px;color:var(--faint)}
.big{font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.big small{font-size:16px;color:var(--muted);font-weight:500;margin-left:3px}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;align-self:flex-start}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.grey{background:var(--surface-2);color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:600;font-size:14.5px;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.btn:hover:not(:disabled){opacity:.88}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.crit{background:var(--crit);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:9px}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btncol{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.altrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;padding:4px 0;cursor:pointer;position:relative}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.tgl .sw{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;order:2}
.tgl .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.tgl input:checked+.sw{background:var(--accent)}.tgl input:checked+.sw::after{transform:translateX(16px)}

/* огляд */
.g-over{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:"bal bal self gap" "bal bal exp sales" "envs envs tx tx" "np cb tx tx"}
.a-bal{grid-area:bal}.a-self{grid-area:self}.a-gap{grid-area:gap}.a-exp{grid-area:exp}.a-sales{grid-area:sales}.a-np{grid-area:np}.a-cb{grid-area:cb}.a-envs{grid-area:envs}.a-tx{grid-area:tx}
.balv{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.balv small{font-size:22px;color:var(--muted);font-weight:500;margin-left:4px}
.delta{font-size:13.5px;color:var(--accent);font-weight:500}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}.qa button{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:500}.qa button:hover{background:var(--line)}.qa svg{width:17px;height:17px}
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin-top:auto}
.alloc i{height:100%}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px}
.legend div{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}
.legend b{font-size:15px;color:var(--ink);font-weight:600}
.legend .lt{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.spark{width:100%;height:56px;display:block;margin-top:auto}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bars{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:auto}
.bars i{flex:1;border-radius:5px;background:var(--surface-2);transform-origin:bottom;animation:barup .6s var(--ease) both}
.bars i.today{background:var(--accent)}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.days{display:flex;gap:5px;font-size:11px;color:var(--muted)}.days span{flex:1;text-align:center}
.minilist{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.minilist div{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.minilist span{color:var(--muted)}
.erow{display:grid;grid-template-columns:30px minmax(0,1fr) auto 90px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%}
.erow:first-child{border-top:0}
.eic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.erow .t{font-size:14.5px;font-weight:500;line-height:1.2}.erow .s{font-size:12.5px;color:var(--muted)}.erow .s.crit{color:var(--crit)}
.erow .a{font-weight:600;text-align:right;white-space:nowrap}
.bar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s var(--ease)}
.unal{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:9px 12px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:36px 1fr auto;gap:11px;align-items:center;padding:8px 0}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.li .t{font-size:14px;font-weight:500;line-height:1.25}.li .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.amt.in{color:var(--ok)}.amt.neg{color:var(--crit)}
.li.new{animation:newrow 1.6s var(--ease)}
@keyframes newrow{0%{background:var(--accent-soft)}100%{background:transparent}}
.status{display:flex;gap:10px;align-items:flex-start}
.status .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.status .si svg{width:18px;height:18px}
.status.crit .si{background:var(--crit-soft);color:var(--crit)}.status.ok .si{background:var(--accent-soft);color:var(--accent)}

/* конверти */
.g-env{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{border:0;background:var(--surface-2);border-radius:9px;padding:7px 12px;font-size:13.5px}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.taxline{font-size:13px;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:3px 0;font-size:14px}
.prow .hint2{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.prow input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.prow .v{font-weight:600;font-variant-numeric:tabular-nums}
.pgroup{background:var(--surface-2);border-radius:12px;padding:8px 12px}
.pgroup .gh{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.selfline{display:flex;justify-content:space-between;font-weight:600}
.selfline.bad{color:var(--crit)}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.split i{height:100%;transition:flex-grow .45s var(--ease)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.field input{font:inherit;font-size:22px;font-weight:600;color:var(--ink);background:var(--surface-2);border:0;border-radius:11px;padding:9px 12px;width:100%}
.envgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.env{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .3s}
.env.wide{grid-column:1/-1}
.env .top{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center}
.env .nm{font-size:14.5px;font-weight:600;line-height:1.2;display:block}
.env .gl{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.env .gl.crit{color:var(--crit)}
.env .pc{font-size:12.5px;color:var(--muted)}
.env b{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.env .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.sub2{display:flex;gap:8px;font-size:12.5px;color:var(--muted)}
.sub2 span{flex:1;background:var(--surface-2);border-radius:9px;padding:6px 10px;line-height:1.3}
.sub2 b{display:block;font-size:15px;color:var(--ink);font-weight:600;letter-spacing:0}
.env .plus{position:absolute;right:14px;top:-9px;font-size:12.5px;font-weight:600;color:var(--surface);background:var(--ok);border-radius:7px;padding:1px 6px;opacity:0}
.env.bump{box-shadow:0 0 0 2px var(--accent)}
.env.bump .plus{animation:plus 1.3s var(--ease)}
@keyframes plus{0%{opacity:0;transform:translateY(4px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.paybanner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--surface);animation:rise .35s var(--ease)}
.paybanner .coin{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.paybanner .t{font-size:12.5px;opacity:.7}.paybanner b{font-size:18px;font-weight:600}
.flychip{position:fixed;left:0;top:0;z-index:80;padding:3px 8px;border-radius:8px;font-size:12.5px;font-weight:600;color:#fff;pointer-events:none;white-space:nowrap}
.hint{font-size:14px;border-radius:11px;padding:10px 12px;background:var(--warn-soft);line-height:1.35}
.hint.ok{background:var(--accent-soft)}.hint.crit{background:var(--crit-soft)}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* прогноз */
.g-radar{display:grid;gap:14px;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.scan{display:flex;align-items:center;gap:12px;padding:8px 0}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:none}
.alert-card{border-left:3px solid var(--crit)}
.billbtn{border:0;background:var(--surface-2);border-radius:8px;padding:3px 10px;margin-top:4px;font-weight:600;font-size:13px}
.billst{display:inline-block;margin-top:3px;font-size:12.5px;color:var(--accent);font-weight:500}
.paidli .t{color:var(--muted)}
.dbox{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dbox b{font-size:13px}.dbox small{font-size:9.5px;color:var(--muted)}

/* операції */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.srcb{display:inline-flex;align-items:center;gap:9px}
.srcb .ic{width:28px;height:28px;font-size:9.5px}
.tblwrap{overflow-x:auto}
.mini-split{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;min-width:120px}
.mini-split i{display:block;height:100%}

/* інтеграції */
.g-int{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.int .head{display:flex;align-items:center;gap:12px}
.int .ic{width:40px;height:40px;font-size:11.5px}
.int b{font-size:15px;font-weight:600}

/* модальні вікна */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,10,9,.36);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s both}
.modal.closing{animation:fadeout .2s both}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.panel{width:min(440px,100%);max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.3);animation:zoom .28s var(--ease) both}
.panel.wide{width:min(560px,100%)}
.modal.closing .panel{animation:zoomout .2s ease-in both}
@keyframes zoom{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes zoomout{to{opacity:0;transform:translateY(8px)}}
.panel.swap>*{animation:rise .25s var(--ease) both}
.panel h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.lbl{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){font-weight:500;text-align:right}
.stp{display:flex;gap:5px}
.stp i{flex:1;height:3px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.stp i.on::after{content:"";position:absolute;inset:0;background:var(--ink)}
.checks{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.checks div{display:flex;align-items:center;gap:10px;font-size:14.5px;opacity:.35;transition:opacity .3s}
.checks div.busy,.checks div.done{opacity:1}
.checks .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.checks div.done .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.checks div.busy .c{border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.success{width:56px;height:56px;align-self:center}
.success circle,.success path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s var(--ease) forwards}
.success path{animation-delay:.35s}
.paym{display:flex;flex-direction:column;gap:6px}
.pm{display:grid;grid-template-columns:38px 1fr 20px;gap:10px;align-items:center;border:0;background:var(--surface-2);border-radius:11px;padding:8px 11px;text-align:left;font-size:14px}
.pm .pmi{width:38px;height:26px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.pm .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint)}
.pm[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--surface)}
.pm[aria-pressed="true"] .rd{border:5px solid var(--ink)}

/* сповіщення: банер, центр сповіщень, лист */
.push{position:fixed;right:20px;top:18px;z-index:70;width:min(370px,calc(100vw - 32px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:36px 1fr;gap:11px;box-shadow:0 14px 34px -14px rgba(0,0,0,.25);text-align:left;animation:pushIn .4s var(--ease) both;cursor:pointer}
.push.out{animation:pushOut .28s ease-in both}
@keyframes pushIn{from{transform:translateX(120%)}to{transform:none}}
@keyframes pushOut{to{transform:translateX(120%);opacity:0}}
.push .pi{width:36px;height:36px;border-radius:9px;overflow:hidden}
.push .pi img{width:100%;height:100%;display:block}
.push .h{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.push .tt{font-size:14.5px;font-weight:600;line-height:1.3;display:block}
.push .b{font-size:13.5px;line-height:1.35;display:block}
.push .em{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.npanel{position:fixed;right:20px;top:66px;z-index:65;width:min(380px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.3);padding:14px 16px;animation:rise .2s var(--ease) both}
.npanel h4{margin:0 0 6px;font-size:15px}
.ntf{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;border-left:0;border-right:0;border-bottom:0;background:none;width:100%}
.ntf:first-of-type{border-top:0}
.ntf .ni{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2)}
.ntf .ni svg{width:17px;height:17px}
.ntf .t{font-size:14px;font-weight:600;line-height:1.25;display:block}
.ntf .s{font-size:13px;color:var(--muted);line-height:1.3;display:block}
.ntf .w{font-size:12px;color:var(--faint);display:flex;gap:10px;align-items:center;margin-top:2px}
.ntf .w button{border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:500}
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail .mh{background:var(--surface-2);padding:10px 14px;font-size:13px;display:grid;grid-template-columns:52px 1fr;gap:3px 8px}
.mail .mh span:nth-child(odd){color:var(--muted)}
.mail .mb{padding:18px 16px;font-size:14.5px;line-height:1.5;display:flex;flex-direction:column;gap:12px}
.mail .mb .logo{display:flex;align-items:center;gap:8px;font-weight:700}
.mail .mb .logo img{width:22px;height:22px;border-radius:6px}
.mail .mb .cta{align-self:flex-start;background:var(--accent);color:#fff;border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px}
.mail .mb .ft{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--surface);border-radius:11px;padding:10px 15px;font-size:14px;white-space:nowrap;animation:rise .25s var(--ease)}
.hl{animation:hl 1.8s var(--ease)}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 transparent}15%,70%{box-shadow:0 0 0 2px var(--warn)}}

@media (max-width:1240px){
  .g-over{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"bal bal self" "bal bal gap" "exp sales np" "envs envs cb" "tx tx tx"}
  .g-int{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .sb{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .demo,.sb-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav button{white-space:nowrap;flex:none}
  .brand{padding-bottom:8px}
  .main{padding:16px 16px 40px}
  .g-over{grid-template-columns:1fr 1fr;grid-template-areas:"bal bal" "self gap" "exp sales" "np cb" "envs envs" "tx tx"}
  .g-env,.g-radar{grid-template-columns:1fr}
  .g-radar .lcol{display:contents}.g-radar #c-reg{order:2}   /* на вузькому екрані платежі йдуть після календаря */
  .me .nm,.me .sb2,.datechip{display:none}
}
@media (max-width:560px){
  .g-over{grid-template-columns:1fr;grid-template-areas:"bal" "self" "gap" "exp" "sales" "np" "cb" "envs" "tx"}
  .envgrid{grid-template-columns:1fr}
  .erow{grid-template-columns:30px minmax(0,1fr) auto}.erow .bar,.erow>span:last-child:empty{display:none}
  .hd h1{font-size:21px}
  .g-int{grid-template-columns:1fr}
  .legend{grid-template-columns:1fr 1fr}
  .balv{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* вхід і профіль */
.auth{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:24px 20px;animation:fade .25s both;overflow-y:auto}
.auth.closing{animation:fadeout .25s both}
.authbox{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;margin:auto 0}
.authbox .obl{background:var(--surface);border-radius:14px;padding:4px 14px}
.authbox .bankbox{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.regrow{padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}.regrow:first-child{border-top:0}
.regrow .t,.regrow .s{display:block}.regrow .t{font-weight:500;color:var(--ink)}.regrow .s{font-size:12.5px;color:var(--muted)}
.regrow .linkbtn{order:1;margin-left:auto;flex:none}
.field.sm input,.field.sm select{font-size:15px;font-weight:500}
.field select{font:inherit;color:var(--ink);background:var(--surface-2);border:0;border-radius:11px;padding:9px 12px;width:100%}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.regrow .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.int .tgl{margin-top:auto}
.authbox .logo{width:48px;height:48px;border-radius:13px}
.authbox h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.authbox p{margin:0;color:var(--muted);font-size:14.5px}
.authbox .f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.authbox .f input{font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:0;border-radius:11px;padding:11px 13px;width:100%}
.authbox .f input.code{letter-spacing:.5em;text-align:center;font-size:24px}
.authbox .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.authbox .back{border:0;background:none;color:var(--muted);font-size:14px;text-align:left;padding:0}
.profrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:center}
.profrow:first-of-type{border-top:0}.profrow span{color:var(--muted)}
.profrow input{font:inherit;font-size:14.5px;border:0;background:var(--surface-2);border-radius:8px;padding:5px 9px;text-align:right;width:220px;color:var(--ink)}
.profhead{display:flex;gap:12px;align-items:center}.profhead .avatar{width:48px;height:48px;font-size:16px}

/* субтитри і курсор авто-показу */
.subs{position:fixed;left:calc(50% + 118px);bottom:18px;transform:translateX(-50%);z-index:60;width:min(680px,calc(100vw - 296px));background:#141614;color:#fff;border-radius:14px;padding:11px 16px 15px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;font-size:15px;line-height:1.4;box-shadow:0 16px 40px -16px rgba(0,0,0,.4)}
.subs .k{font-size:12.5px;opacity:.6;font-variant-numeric:tabular-nums}
.subs i{position:absolute;left:16px;bottom:6px;height:3px;border-radius:2px;background:var(--accent);width:0}
.fcur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-4px 0 0 -4px;border-radius:50%;z-index:70;pointer-events:none;opacity:0;background:rgba(20,22,20,.25);border:2px solid #141614;transition:transform .75s cubic-bezier(.5,0,.2,1),opacity .3s}
.fcur.on{opacity:1}
.fcur.clk{animation:fclk .45s ease-out}
@keyframes fclk{50%{scale:.65}100%{scale:1}}
@media (max-width:960px){.subs{left:50%;width:min(680px,calc(100vw - 24px))}}
</style>

<body>
<div class="shell">
  <aside class="sb">
    <div class="brand"><img src="../icons/icon-192.png" alt="">Фінансист</div>
    <nav class="nav" id="nav" aria-label="Розділи"></nav>
    <div class="demo" id="demo">
      <div class="demo-h"><span>Демо для журі</span><button class="linkbtn mut" id="demo-toggle" style="padding:0">Сховати</button></div>
      <div class="jsteps" id="jsteps"></div>
      <button class="linkbtn" id="reset">Скинути демо</button>
      <button class="linkbtn" id="first">Перший запуск</button>
      <button class="linkbtn" id="stmt">Нова виписка з банку</button>
      <div class="tcard">Тестова картка <b>4111 1111 1111 1111</b>, будь-який термін і CVV</div>
    </div>
    <div class="sb-foot">
      <a class="linkbtn mut" href="../">Мобільна версія</a>
    </div>
  </aside>
  <main class="main">
    <header class="hd">
      <h1 id="hd-title">Огляд</h1>
      <div class="hd-r"><span class="datechip" id="date"></span>
        <button class="btn sm" id="pay-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v13M6 11l6 6 6-6"/><path d="M5 20h14"/></svg>Прийняти оплату</button>
        <button class="icbtn" id="bell" aria-label="Сповіщення"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="badge" hidden></span></button>
        <button class="me" data-avatar aria-label="Профіль"><span class="avatar" data-ini>ОК</span><span><span class="nm" data-hello>Олена К.</span><span class="sb2" data-shop>ФОП · Крок</span></span></button></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div class="subs" id="subs" hidden aria-live="polite"><span class="k" id="subs-k"></span><span id="subs-t"></span><i id="subs-bar"></i></div>
<div class="fcur" id="fcur" aria-hidden="true"></div>
<div id="layer"></div>

<script>
(function(){
"use strict";
/* ======================================================================
   СПІЛЬНА МОДЕЛЬ (та сама, що в мобільній версії; стан у localStorage спільний)
   ====================================================================== */
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('uk-UA')+' ₴';
const fmtn=n=>Math.round(n).toLocaleString('uk-UA');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WD=['нд','пн','вт','ср','чт','пт','сб'],MONTHS=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const today=new Date();today.setHours(0,0,0,0);
const dayAt=i=>{const d=new Date(today);d.setDate(d.getDate()+i);return d};
const dm=i=>{const d=dayAt(i);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')};
const wd=i=>WD[dayAt(i).getDay()];
const inDays=i=>i===0?'сьогодні':i===1?'завтра':`через ${i} ${i<5?'дні':'днів'}`;
$('date').textContent=`${WD[today.getDay()]}, ${today.getDate()} ${MONTHS[today.getMonth()]}`;

/* «Витрати» = операційні (оренда, зарплата, тарифи) + маркетинг. Один баланс, частки задаються окремо */
const ENVS=[
  {k:'tax', n:'Податки',   c:'var(--c-tax)', l:'П', get goal(){return S.group==='12'?TAX12+ESV:TAX_Q3+3*ESV}, get gl(){return S.group==='12'?'щомісяця податок, ВЗ і ЄСВ':'до 19.11 · податок за квартал і ЄСВ'}},
  {k:'buy', n:'Закупівля', c:'var(--c-buy)', l:'З', get goal(){return amtOf(EDIT(BUY))}, get gl(){return isOff('buy')?'закупівля товару':'партія постачальнику '+inDays(EDIT(BUY).d)}},
  {k:'exp', n:'Витрати',   c:'var(--c-exp)', l:'В', get goal(){return amtOf(OPS_PAYS[0])}, get gl(){return isOff('o0')?'регулярні платежі з виписки':'оренда '+fmt(amtOf(OPS_PAYS[0]))+' '+inDays(payDay(0))}},
  {k:'res', n:'Резерв',    c:'var(--c-res)', l:'Р', goal:60000, gl:'подушка на місяць'},
  {k:'self',n:'Собі',      c:'var(--c-self)',l:'С', goal:0,     gl:'вільні гроші'},
];
const ESV=1902.34, TAX_Q3=70200, TAX12=2594.10;   // ЄСВ за себе на місяць; податок за III квартал; 1–2 група: єдиний податок до 1 729,40 + військовий збір 864,70 на місяць
const SALES_DAY=13000;
const OPS_PAYS=[{id:'o0',d:2,t:'Оренда складу',a:40000},{id:'meta',d:10,t:'Реклама Meta',a:18000},{id:'o1',d:14,t:'Зарплата помічниці',a:15000},{id:'o2',d:19,t:'Тариф Prom.ua',a:4500}];   // платежі з «Витрат»
const BUY={id:'buy',d:13,t:'Партія постачальнику',a:52000};   // платіж із «Закупівлі»: лише в календарі, у прогноз «Витрат» не входить
/* правки платежів (вікно «Змінити платіж»): S.ed[id] = назва, дата, періодичність, реквізити; S.extra = додані платежі. Порожні = як у коді */
const EDIT=p=>({...p,...(S.ed&&S.ed[p.id])});
const EXPP=()=>[...OPS_PAYS,...(S.extra||[])].map(EDIT);   // платежі «Витрат»: j = індекс тут, видалені лишаються в списку, щоб індекси не зсувались
const payDay=(j,mv)=>{mv=mv||{};return mv[j]!=null?mv[j]:S.moved&&S.moved[j]!=null?S.moved[j]:EXPP()[j].d};   // платіж можна перенести на іншу дату
const REPS={w:'щотижня',m:'щомісяця',q:'щокварталу',o:'разово'};
const occ=(p,d0)=>{const r=[];for(let d=d0,k=0;d<30;d+=p.rep==='w'?7:99,k++)r.push({...p,id:k?p.id+'~'+k:p.id,d});return r};   // щотижневий платіж повторюється в межах 30 днів, id повторів «id~1», «id~2»
/* регулярні платежі «знайдено у виписці»: Олена відповідає так/ні, нову суму підтверджує (S.off, S.amt; порожні = як у DEF) */
const amtOf=p=>(S.amt&&S.amt[p.id])||p.a;
const isOff=id=>!!(S.off&&S.off[id]);
const isConn=n=>!(S.conn&&S.conn[n]===false);
const REGP=()=>[...EXPP().map((p,j)=>({...p,j})),EDIT(BUY)].filter(p=>!p.del);
const dayOf=p=>p.j!=null?payDay(p.j):p.d;
const REG_S={o0:'щомісяця',meta:'з картки ФОП',o1:'щомісяця',o2:'щомісяця',buy:'фабрика, регулярно'};
const regHTML=(off,edit)=>REGP().map(p=>`<label class="tgl regrow"><span><span class="t">${p.t}</span><span class="s">${fmt(amtOf(p))} · ${p.rep?REPS[p.rep]:REG_S[p.id]}${edit?' · '+dm(dayOf(p)):''}</span></span><input type="checkbox" data-reg="${p.id}"${off[p.id]?'':' checked'}><span class="sw"></span>${edit?`<button type="button" class="linkbtn" data-edit="${p.id}">Змінити</button>`:''}</label>`).join('');
const bindReg=(root,off,after)=>root.querySelectorAll('[data-reg]').forEach(i=>i.onchange=()=>{if(i.checked)delete off[i.dataset.reg];else off[i.dataset.reg]=true;if(after)after(i)});
const OD_RATE=.24,OD_SHARE=.30;
const DEF={group:'3',pct:{buy:50,ops:12,mkt:15,res:5},bal:{tax:51426,buy:38400,exp:28480,res:12000,self:6800},
  tx:[{src:'Checkbox',t:'Каса в магазині, 3 чеки',a:4180,ago:'сьогодні 12:40',day:0},{src:'NovaPay',t:'Кросівки «Ран», 41',a:3100,ago:'сьогодні 11:05',day:0},{src:'Нова пошта',t:'Післяплата, ТТН 2045…118',a:2800,ago:'сьогодні 09:52',day:0},{src:'LiqPay',t:'Лофери «Ліра», 37',a:2800,ago:'вчора 21:17',day:1}],
  od:0,debt:0,unalloc:0,autoRepay:true,done:{},alert:false,notes:[],sysPush:false,emailOn:true};
let S;
const load=()=>{try{const j=JSON.parse(localStorage.getItem('fk-state')||'null');if(!j)return null;
  if(j.v===4)return j.s;
  if(j.v===3){const s=j.s;s.bal.exp=(s.bal.ops||0)+(s.bal.mkt||0);delete s.bal.ops;delete s.bal.mkt;s.moved={};s.paid={};return s}   // старий формат: «Операційні» і «Маркетинг» зливаються у «Витрати»
}catch(e){}return null};
const save=()=>{try{localStorage.setItem('fk-state',JSON.stringify({v:4,s:S}))}catch(e){}};
const fix=()=>{S.unalloc=S.unalloc||0;if(S.debt===undefined)S.debt=S.od||0;if(S.autoRepay===undefined)S.autoRepay=true;if(!S.notes)S.notes=[];if(S.emailOn===undefined)S.emailOn=true};
S=load()||JSON.parse(JSON.stringify(DEF));fix();
addEventListener('storage',e=>{if(e.key==='fk-state'&&!authEl){const n=load();if(n){S=n;fix();render(false);if(typeof paintUser==='function')paintUser()}}});   // зміни з мобільної версії в іншій вкладці
const taxPct=g=>(g||S.group)==='3'?6:(g||S.group)==='3v'?4:0;
const expPct=()=>S.pct.ops+S.pct.mkt;
const selfPct=()=>100-taxPct()-S.pct.buy-expPct()-S.pct.res;
const pctOf=k=>k==='tax'?taxPct():k==='self'?Math.max(0,selfPct()):k==='exp'?expPct():S.pct[k];
const total=()=>Object.values(S.bal).reduce((a,b)=>a+b,0)+(S.unalloc||0);   // усе, що лежить на рахунку ФОП: конверти + ще не розподілене
const taxOf=a=>Math.round(a*taxPct()/100);                                                // податок відкладається від повної суми надходження
const repayOf=a=>S.autoRepay?Math.min(S.debt||0,Math.round(a*OD_SHARE)):0;            // погашення овердрафту: 30% надходження, після податку і до поділу решти
const expSplit=v=>{const o=S.pct.ops,m=S.pct.mkt,t=o+m||1;return{ops:v*o/t,mkt:v*m/t}};
/* прогноз «Витрат»: x.add докласти зараз, x.debt додати борг, x.move перенести платіж, x.now оплатити платіж сьогодні */
function forecast(x){x=x||{};
  const PL=EXPP().map((p,j)=>({...p,j,a:amtOf(p)})).filter(p=>!p.del&&!isOff(p.id)).flatMap(p=>occ(p,payDay(p.j,x.move))).map(p=>x.now===p.id?{...p,d:0}:p).filter(p=>!(S.paid&&S.paid[p.id]==='paid'));   // сплачене із застосунку вже списано з конверта
  const tp=taxPct()/100,k=expPct()/100/(1-tp);let debt=(S.debt||0)+(x.debt||0);const ua=S.unalloc||0,pend=ua-taxOf(ua)-repayOf(ua);debt-=repayOf(ua);
  let b=S.bal.exp+pend*k+(x.add||0);const days=[];let inflow0=null;
  for(let i=0;i<30;i++){const pays=PL.filter(p=>p.d===i);const low=b-pays.reduce((a,p)=>a+p.a,0);
    const rp=S.autoRepay?Math.min(debt,SALES_DAY*OD_SHARE):0;debt-=rp;const inflow=(SALES_DAY*(1-tp)-rp)*k;if(inflow0===null)inflow0=inflow;b=low+inflow;days.push({i,low,end:b,pays})}
  const g=days.find(d=>d.low<0);   // овердрафт береться рівно на дефіцит першого розриву (специфікація команди)
  return{days,gap:g?{i:g.i,need:-g.low,first:-g.low,pay:g.pays[0]}:null,inflow:inflow0};
}
const odAmount=g=>{let X=Math.ceil(g.need/100)*100;for(let i=0;i<200;i++){const f=forecast({add:X,debt:X});if(f.days[g.i].low>=0)return X;X+=100}return X};
const odDays=a=>Math.max(1,Math.ceil(a/(SALES_DAY*OD_SHARE)));
const parseAmt=v=>{const n=parseInt(String(v).replace(/[^\d]/g,''),10);return isNaN(n)?0:n};   // «2 400», «2400», «2 400 ₴» → 2400

function md5bytes(bytes){
  const K=new Int32Array(64),r=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const len=bytes.length,nb=((len+8)>>>6)+1,w=new Int32Array(nb*16);
  for(let i=0;i<len;i++)w[i>>2]|=bytes[i]<<((i%4)*8);w[len>>2]|=0x80<<((len%4)*8);w[nb*16-2]=len*8;
  let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  for(let j=0;j<w.length;j+=16){let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){let F,g;if(i<16){F=(B&C)|(~B&D);g=i}else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}else if(i<48){F=B^C^D;g=(3*i+5)%16}else{F=C^(B|~D);g=(7*i)%16}
      const tmp=D;D=C;C=B;const x=(A+F+K[i]+w[j+g])|0;B=(B+((x<<r[i])|(x>>>(32-r[i]))))|0;A=tmp}
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0}
  const out=new Uint8Array(16);[a0,b0,c0,d0].forEach((v,i)=>{for(let k=0;k<4;k++)out[i*4+k]=(v>>>(k*8))&255});return out;
}
function hmacMD5(key,msg){const enc=new TextEncoder();let k=enc.encode(key);if(k.length>64)k=md5bytes(k);const kp=new Uint8Array(64);kp.set(k);
  const ip=kp.map(b=>b^0x36),op=kp.map(b=>b^0x5c),m=enc.encode(msg);
  return [...md5bytes(new Uint8Array([...op,...md5bytes(new Uint8Array([...ip,...m]))]))].map(b=>b.toString(16).padStart(2,'0')).join('')}

const reminded={};let idleT=0,hiddenT=0,leftWith=null,odLeft=false;
function pendingAction(){
  if(S.unalloc>0)return{k:'split',title:'Гроші чекають розподілу',body:`${fmt(S.unalloc)} ще не розкладено по конвертах`,go:()=>{go('env');setTimeout(()=>flash('c-pending'),300)}};
  if(odLeft&&forecast().gap)return{k:'od',title:'Овердрафт не оформлено',body:'Ви почали, але не підписали. Розрив досі відкритий',go:()=>{go('radar');setTimeout(runRadar,300)}};
  if(S.alert&&forecast().gap)return{k:'gap',title:'Розрив не закрито',body:'Оберіть: овердрафт, Резерв або перенести платіж',go:()=>{go('radar');setTimeout(runRadar,300)}};
  return null}
const modalOpen=()=>{const m=$('layer').querySelector('.modal');return !!(m&&!m.classList.contains('closing'))};
function remindNow(){if(auto||authEl)return;const a=pendingAction();if(!a||reminded[a.k]||modalOpen())return;reminded[a.k]=true;addNote('remind',a.title,a.body);save();banner(a.title,a.body,a.go,S.emailOn);$('badge').hidden=false}
function poke(){clearTimeout(idleT);idleT=setTimeout(remindNow,30000)}
['pointerdown','keydown','scroll'].forEach(ev=>addEventListener(ev,poke,{passive:true,capture:true}));poke();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){const a=pendingAction();leftWith=a;clearTimeout(hiddenT);if(a&&!auto&&!authEl)hiddenT=setTimeout(()=>{if(!reminded[a.k]){reminded[a.k]=true;addNote('remind',a.title,a.body);save();sysNotify(a.title,a.body)}},5000)}
  else{clearTimeout(hiddenT);const a=pendingAction();if(a&&leftWith&&a.k===leftWith.k&&!reminded[a.k]&&!auto&&!authEl&&!modalOpen()){banner(a.title,a.body,a.go,S.emailOn);reminded[a.k]=true}leftWith=null;poke()}});

    <div class="small">${od.amt-od.g.need>=100?`Дефіцит ${fmt(od.g.need)} і погашення до ${dm(od.g.i)}`:`Рівно дефіцит на ${dm(od.g.i)}`}</div>

    <div class="btnrow"><button class="btn" id="nx">Надіслати запит</button><button class="btn ghost" id="cl">Скасувати</button></div>
    <p class="note">Доступно, бо рахунок ФОП у Райффайзен Банку. Умови умовні.</p>`;

    i.oninput=()=>{i.value=digits(i.value).slice(0,4);if(i.value.length===4){const d=authEl.dataset.phone;if(ob){S.profile=Object.assign({},DEF_PROFILE,{phone:d});openOnb('bank');return}if(S.profile&&digits(S.profile.phone)===d&&S.profile.name){S.auth=true;finishAuth()}else{S.profile={phone:d,email:''};openAuth('profile')}}}}
  if(step==='profile'){let g=S.group;const sv=$a('a-save');const chk=()=>{sv.disabled=!($a('a-name').value.trim()&&$a('a-shop').value.trim())};['a-name','a-last','a-shop'].forEach(id=>$a(id).oninput=chk);chk();
    authEl.querySelectorAll('.gchip').forEach(b=>b.onclick=()=>{g=b.dataset.g;authEl.querySelectorAll('.gchip').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    sv.onclick=()=>{S.profile=Object.assign({},S.profile,{name:$a('a-name').value.trim(),last:$a('a-last').value.trim(),shop:$a('a-shop').value.trim()});S.group=g;if(ob){paintUser();openOnb('scan');return}S.auth=true;finishAuth()};
    const c=$a('a-cancel');if(c)c.onclick=closeAuth;setTimeout(()=>$a('a-name').focus(),50)}
}
function closeAuth(){if(!authEl)return;const el=authEl;authEl=null;el.classList.add('closing');setTimeout(()=>el.remove(),250)}
function finishAuth(){save();paintUser();closeAuth();render(false)}
function logout(){S.auth=false;save();closeModal();hidePush();openAuth('phone')}
/* онбординг: банк → дані → виписка → відсотки → сервіси → сповіщення. Усе в імітації, сервера немає */
const obBar=n=>`<div class="stp">${[1,2,3,4,5,6,7,8,9].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
const OB_CONN=[['WayForPay','еквайринг'],['NovaPay','еквайринг'],['LiqPay','еквайринг'],['Checkbox','каса'],['Нова пошта','доставка, післяплата']];
function openOnb(step){if(!ob||!authEl)return;   // онбординг скасовано: скинули демо
  let b='';
  if(step==='bank')b=`<h2>Підключіть рахунок ФОП</h2><p>Тоді застосунок сам бачитиме надходження і платежі. Вводити їх вручну не треба.</p>
    <div class="obl"><div class="kv" style="padding:12px 0"><span>Читаємо</span><span>виписку, баланс, реквізити</span><span>Не бачимо</span><span>пароль від банку</span><span>Платежі</span><span>лише з вашим підтвердженням</span></div></div>
    <button class="btn" id="o-next">Підключити Raiffeisen</button>`;
  if(step==='consent')b=`<div class="bankbox"><div class="li" style="padding:0">${srcIc('Raiffeisen')}<div><div class="t">Raiffeisen Business</div><div class="s">запит на доступ</div></div><span></span></div>
    <h3 style="margin:0">«Фінансист» просить доступ до рахунку ФОП</h3>
    <div class="kv"><span>Дозволи</span><span>читати виписку й баланс</span><span>Рахунок</span><span>ФОП Коваль О., гривня</span><span>Термін</span><span>180 днів, можна відкликати</span></div>
    <div class="btncol"><button class="btn" id="o-next">Дозволити</button><button class="btn ghost" id="o-back">Скасувати</button></div></div>
    <p class="note">Імітація: доступ до виписки рахунку ФОП через API банку ще не підтверджено. Інший шлях: <button class="linkbtn" id="o-file">завантажити файл виписки</button></p>`;
  if(step==='scan')b=`<h2>Аналізуємо виписку</h2><p>Останні 8 тижнів: надходження, регулярні платежі, податки.</p>
    <div class="checks" id="o-checks"><div><span class="c"></span>Надходження і середні продажі</div><div><span class="c"></span>Повторювані платежі</div><div><span class="c"></span>Податки і ЄСВ</div></div>`;
  if(step==='found')b=`<h2>Ось що ми знайшли</h2><p>Це регулярні платежі? Вимкніть, якщо платіж був разовий.</p>
    <div class="obl">${regHTML(ob.off,true)}</div>
    <div class="obl"><div class="kv" style="padding:12px 0"><span>Продажі</span><span>≈ ${fmt(SALES_DAY)} на день</span><span>Податок</span><span>${S.group==='12'?'фіксований, щомісяця':taxPct()+'% з надходжень'}, рахуємо самі</span><span>ЄСВ</span><span>${ESV.toLocaleString('uk-UA')} ₴ на місяць</span></div></div>
    <p class="note">Змінити можна будь-коли на сторінці «Прогноз і платежі».</p><button class="btn" id="o-next">Усе вірно</button>`;
  if(step==='pct'){const parts=ENVS.map(e=>[e,pctOf(e.k)]).filter(x=>x[1]>0);b=`<h2>Стартові відсотки</h2><p>Так ділитиметься кожне надходження. Змінити можна на сторінці «Конверти».</p>
    <div class="obl" style="padding:14px;display:flex;flex-direction:column;gap:10px"><div class="split">${parts.map(([e,p])=>`<i style="flex-grow:${p};background:${e.c}"></i>`).join('')}</div><div class="legend">${parts.map(([e,p])=>`<div><span class="lt"><i style="background:${e.c}"></i>${e.n}</span><b class="num">${p}%</b></div>`).join('')}</div></div>
    <div class="btncol"><button class="btn" id="o-next">Прийняти</button><button class="btn ghost" id="o-skip">Змінити пізніше</button></div>`}
  if(step==='conn'){OB_CONN.forEach(([n])=>{if(ob.conn[n]===undefined)ob.conn[n]=false});   // спершу нічого не підключено, користувач підв'язує сам
    b=`<h2>Каси й еквайринг</h2><p>За бажанням. Тоді оплати видно одразу, ще до зарахування на рахунок.</p>
    <div class="obl">${OB_CONN.map(([n,t])=>`<div class="tgl regrow" style="cursor:default"><span style="display:flex;gap:10px;align-items:center">${srcIc(n)}<span><span class="t">${srcName(n)}</span><span class="s">${t}</span></span></span><span data-conn="${n}">${ob.conn[n]===false?`<button class="billbtn" style="margin:0" data-link="${n}">Підв'язати</button>`:'<span class="chip">підключено</span>'}</span></div>`).join('')}</div>
    <button class="btn" id="o-next">${OB_CONN.some(([n])=>ob.conn[n]!==false)?'Далі':'Пропустити'}</button>`}
  if(step==='push')b=`<h2>Сповіщення</h2><p>Попередимо про касовий розрив і нагадаємо про платежі. Стежити самій не треба.</p>
    <label class="f" for="o-mail">Пошта<input id="o-mail" type="email" value="${S.profile.email||''}"></label>
    <div class="obl"><label class="tgl regrow"><span>Дублювати сповіщення на пошту</span><input type="checkbox" id="o-email"${S.emailOn?' checked':''}><span class="sw"></span></label>
    ${'Notification' in window?`<label class="tgl regrow"><span>Сповіщення браузера</span><input type="checkbox" id="o-push"${S.sysPush?' checked':''}><span class="sw"></span></label>`:''}</div>
    <button class="btn" id="o-next">Готово</button>`;
  authEl.innerHTML=`<div class="authbox">${obBar({bank:3,consent:4,scan:6,found:6,pct:7,conn:8,push:9}[step])}${b}</div>`;authEl.scrollTop=0;
  const $a=id=>authEl.querySelector('#'+id),nx=$a('o-next'),sk=$a('o-skip');
  const NEXT={bank:'consent',found:'pct',pct:'conn',conn:'push'};
  if(nx)nx.onclick=()=>step==='push'?finishOnb():step==='consent'?openAuth('profile'):openOnb(NEXT[step]);
  if(step==='consent'){$a('o-back').onclick=()=>openOnb('bank');$a('o-file').onclick=()=>nx.click()}
  if(step==='scan'){[...authEl.querySelectorAll('#o-checks>div')].forEach((r,j)=>{obT.push(setTimeout(()=>r.classList.add('busy'),j*550));obT.push(setTimeout(()=>{r.classList.remove('busy');r.classList.add('done');r.querySelector('.c').innerHTML='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6l3 3 5-6"/></svg>'},j*550+480))});
    obT.push(setTimeout(()=>openOnb('found'),RM?10:2000))}
  if(step==='found'){bindReg(authEl,ob.off);authEl.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openPayEdit(b.dataset.edit))}
  if(step==='pct')sk.onclick=()=>nx.click();
  if(step==='conn')authEl.querySelectorAll('[data-link]').forEach(bt=>bt.onclick=()=>{const n=bt.dataset.link,slot=bt.parentNode;slot.innerHTML='<span class="spin" style="width:18px;height:18px"></span>';   // імітація входу в кабінет сервісу
    obT.push(setTimeout(()=>{if(!ob||!authEl)return;ob.conn[n]=true;slot.innerHTML='<span class="chip">підключено</span>';nx.textContent='Далі'},RM?10:900))});
  if(step==='push'&&'Notification' in window&&Notification.permission==='denied'){const pp=$a('o-push');if(pp){pp.closest('label').insertAdjacentHTML('afterend','<p class="note" style="padding:0 0 8px">Браузер заблокував сповіщення для цього сайту. Дозвольте їх у налаштуваннях сайту, тоді тумблер запрацює.</p>')}}
  if(step==='push'){$a('o-mail').onchange=()=>{S.profile.email=$a('o-mail').value.trim()};$a('o-email').onchange=()=>{S.emailOn=$a('o-email').checked};const p=$a('o-push');if(p)p.onchange=()=>askPush(p)}
}
function finishOnb(){S.off=ob.off;S.conn=ob.conn;ob=null;S.auth=true;finishAuth();go('over');setTimeout(()=>toast('Готово: дані з виписки підтягнуто'),300)}
async function askPush(pp){if(pp.checked){let r=Notification.permission;if(r==='default'){try{r=await Notification.requestPermission()}catch(e){}}S.sysPush=r==='granted';pp.checked=S.sysPush;save();toast(S.sysPush?'Сповіщення увімкнено':'Браузер не дозволив сповіщення')}else{S.sysPush=false;save()}}
function openProfile(){const p=S.profile||{};const g=(GROUPS.find(x=>x[0]===S.group)||['','—'])[1];const canPush='Notification' in window;
  openModal(`<div class="profhead"><span class="avatar">${initials(p)}</span><div><h3 style="margin:0">${p.name||''} ${p.last||''}</h3><div class="small">ФОП · ${p.shop||''}</div></div></div>
   <div><div class="profrow"><span>Телефон</span><b>${prettyPhone(p.phone)}</b></div><div class="profrow"><span>Пошта</span><input id="pf-mail" type="email" value="${p.email||''}"></div><div class="profrow"><span>Група</span><b>${g}</b></div><div class="profrow"><span>Рахунок</span><b>Райффайзен Банк</b></div><div class="profrow"><span>Тариф</span><b>Пробний · ще 14 днів</b></div>
   <label class="tgl profrow"><span style="color:var(--ink)">Дублювати сповіщення на пошту</span><input type="checkbox" id="pf-email"${S.emailOn?' checked':''}><span class="sw"></span></label>
   ${canPush?`<label class="tgl profrow"><span style="color:var(--ink)">Сповіщення браузера</span><input type="checkbox" id="pf-push"${S.sysPush&&Notification.permission==='granted'?' checked':''}><span class="sw"></span></label>`:''}</div>
   <div class="btnrow"><button class="btn ghost" id="pf-edit">Змінити дані</button><button class="btn ghost" id="pf-out" style="color:var(--crit)">Вийти</button></div>`,'Профіль');
  $('pf-edit').onclick=()=>{closeModal();hidePush();openAuth('profile',true)};$('pf-out').onclick=logout;
  $('pf-mail').onchange=()=>{S.profile.email=$('pf-mail').value.trim();save();toast('Пошту збережено')};
  $('pf-email').onchange=()=>{S.emailOn=$('pf-email').checked;save()};
  const pp=$('pf-push');if(pp)pp.onchange=()=>askPush(pp)}
document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=openProfile);
paintUser();

S.done.dash=true;
const h=location.hash.slice(1);go(PAGES.some(p=>p[0]===h)?h:'over');
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==page&&PAGES.some(p=>p[0]===h))go(h)});if(!S.auth)openAuth('phone');
})();
</script>
</body>
</html>
