<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Targo · веб</title>
<meta name="description" content="Targo: вебверсія для комп'ютера. Кабінет гуртового постачальника і кабінет ФОП-покупця.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E100F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../app.css">
<style>
/* вебверсія: бічне меню з перемикачем ролі | кабінет на всю ширину | панель сценарію */
body{background:var(--app)}
.wshell{display:grid;grid-template-columns:240px minmax(0,1fr) auto;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px;z-index:20}
.wrole{align-self:stretch;display:grid;grid-template-columns:1fr 1fr;font-size:13px}
.vnav{display:flex;flex-direction:column;gap:2px;padding:0;background:none;border:0;overflow:visible}
.vnav button{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--muted);text-align:left;width:100%}
.vnav button[aria-current=page]{background:var(--surface-2);color:var(--ink)}
.vnav svg{width:20px;height:20px;flex:none}
.vnav button.ping::after{left:auto;right:10px;top:50%;margin-top:-4px}
body.role-sup .tabs.vnav,body.role-buy .stabs.vnav,body.role-sup #buy,body.role-buy #sup{display:none}
.side-demo{margin-top:auto}
.wmain{min-width:0}
#sup,#buy{min-height:100vh;overflow:visible}
#buy{isolation:auto}   /* інакше шторка покупця опиняється під бічним меню */
#sup .shd,#buy .apphd{padding:22px 28px 14px}
#sup .sbody{overflow:visible;padding:4px 28px 40px}
#bscr{overflow:visible;display:block;padding:4px 28px 40px;columns:2 360px;column-gap:14px;max-width:1100px}
#bscr>*{break-inside:avoid;margin-bottom:14px}
#bscr>.hero,#bscr>.tiles{column-span:all}
#bscr[data-t=bot],#bscr[data-t=inv]{columns:auto;max-width:640px}
#bscr .tiles{grid-template-columns:repeat(4,1fr)}
.presenter{position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 16px;border-left:1px solid var(--line)}
/* шторки покупця і пуші на вебі як вікна поверх сторінки */
#buy .sheet{position:fixed;align-items:center;justify-content:center;z-index:45}
#buy .panel{width:min(460px,calc(100% - 32px));max-height:90vh;border-radius:22px;padding-bottom:20px}
#buy .grab{display:none}
#pushhost .push{position:fixed;left:auto;right:20px;top:20px;width:min(380px,calc(100% - 40px));z-index:55}
#pushhost .toast{position:fixed}
@media (max-width:1180px){.presenter{display:none}}
@media (max-width:820px){
  .wshell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .side .brand small{display:none}
  .wrole{align-self:center;margin-left:auto}
  .vnav{flex-direction:row;overflow-x:auto;width:100%;scrollbar-width:none}
  .vnav button{width:auto;white-space:nowrap;padding:7px 10px}
  .vnav svg{display:none}
  .side-demo{margin:0}
  #sup .shd,#buy .apphd{padding:14px 16px 10px}
  #sup .sbody,#bscr{padding:4px 16px 28px}
  #bscr .tiles{grid-template-columns:1fr 1fr}
  #pushhost .push{right:10px;left:10px;width:auto;top:10px}
}
</style>
</head>
<body class="role-sup">
<div class="wshell">
  <aside class="side">
    <div class="brand"><span class="logo">T</span><span><b>Targo</b><small>вебверсія</small></span></div>
    <span class="mode wrole"><button data-role="sup" aria-pressed="true">Постачальник</button><button data-role="buy" aria-pressed="false">Покупець</button></span>
    <nav class="stabs vnav" aria-label="Розділи постачальника">
      <button data-stab="new">Нова розстрочка</button><button data-stab="apps">Заявки</button><button data-stab="ar">Дебіторка</button><button data-stab="stmt">Виписка</button><button data-stab="docs">Документи</button>
    </nav>
    <nav class="tabs vnav" aria-label="Розділи покупця">
      <button data-btab="pass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.5 1.8-2.2 3.2-2.2s2.6.7 3.2 2.2M15 10h3M15 13.5h3"/></svg>Паспорт селера</button>
      <button data-btab="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 14h3"/></svg>Погашення</button>
      <button data-btab="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2M20 14v6h-6v-2M17 17h0"/></svg>Рахунки</button>
      <button data-btab="bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 3.3 6.5L4 20l1.3-3.4A8 8 0 0 1 4 12z"/><path d="M9 11h6M9 14h4"/></svg>Бот</button>
    </nav>
    <button class="btn ghost sm side-demo" id="p-show">Демо для журі</button>
  </aside>

  <div class="wmain">
    <section class="sup" id="sup" aria-label="Кабінет постачальника">
      <header class="shd">
        <div class="brand"><span><b>Кабінет постачальника</b><small>ТОВ «Підошва» · гуртовня взуття</small></span></div>
        <span class="today" id="s-today"></span>
      </header>
      <main class="sbody" id="sbody"></main>
    </section>
    <section class="buy" id="buy" aria-label="Кабінет покупця">
      <header class="apphd">
        <span class="me"><span class="avatar">ОК</span><span><span class="nm">Олена Коваль</span><span class="sb">ФОП · «Крок» · Паспорт селера</span></span></span>
      </header>
      <main class="scr" id="bscr"></main>
      <div id="blayer"></div>
    </section>
  </div>

  <aside class="presenter" id="presenter" aria-label="Демо для журі"></aside>
</div>
<div id="pushhost"></div>

<div class="ovl" id="ovl" hidden></div>
<div class="subs" id="subs" hidden aria-live="polite"><span class="k" id="subs-k"></span><span id="subs-t"></span><i id="subs-bar"></i></div>
<div class="fcur" id="fcur" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="../app.js" defer></script>
</body>
</html>
