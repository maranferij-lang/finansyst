<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Фінансист у кишені · вебверсія</title>
<meta name="description" content="Вебверсія Фінансиста у кишені: конверти для ФОПа, розподіл кожного надходження, платіжний радар і овердрафт в один клік.">
<meta name="theme-color" content="#F4F5F2">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: web dashboard. Sidebar (nav + jury scenario) + content grid of soft pastel cards; collapses to one column on narrow screens */
:root{
  --bg:#F4F5F2; --panel:#FAFAF8; --surface:#FFFFFF; --surface-2:#F2F4F1; --ink:#1A1D1B; --muted:#7A817D; --line:#E7E9E4;
  --accent:#2F8F5E; --accent-ink:#FFFFFF; --accent-soft:#E2F2E5;
  --warn:#D9822B; --warn-soft:#FFF0E2; --crit:#D2483A; --crit-soft:#FCE6E3; --ok:#3A9A64; --blue:#7C93E6; --blue-soft:#E8ECFB; --violet:#A98BDB; --teal:#3BA7A0; --pending:#D3D7D3;
  --g-green:linear-gradient(155deg,#DDF1DA 0%,#F2F9EC 45%,#FFFFFF 100%);
  --g-peach:linear-gradient(155deg,#FFE2C9 0%,#FFF3E8 50%,#FFFFFF 100%);
  --g-pink:linear-gradient(155deg,#FBD9D8 0%,#FFF0EE 50%,#FFFFFF 100%);
  --g-blue:linear-gradient(155deg,#DDE4FB 0%,#F1F4FD 50%,#FFFFFF 100%);
  --shadow:rgba(20,30,25,.16);
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1110; --panel:#131614; --surface:#191C1A; --surface-2:#202421; --ink:#E8ECE9; --muted:#8E9792; --line:#272C29;
  --accent:#55C089; --accent-ink:#06120B; --accent-soft:#18301F;
  --warn:#EFA35A; --warn-soft:#33251A; --crit:#F0796B; --crit-soft:#3A201D; --ok:#62C48C; --blue:#93A8F0; --blue-soft:#1E2436; --violet:#BBA2E8; --teal:#5CC5BD; --pending:#3A403C;
  --g-green:linear-gradient(155deg,#1E3424 0%,#1A231C 50%,#191C1A 100%);
  --g-peach:linear-gradient(155deg,#3A2A1C 0%,#251F1A 50%,#191C1A 100%);
  --g-pink:linear-gradient(155deg,#3D2221 0%,#271D1C 50%,#191C1A 100%);
  --g-blue:linear-gradient(155deg,#212A44 0%,#1C2030 50%,#191C1A 100%);
  --shadow:rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;max-width:1520px;margin:0 auto;background:var(--panel)}
.sb{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:600;font-size:15px}
.brand img{width:30px;height:30px;border-radius:9px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14px;text-align:left;transition:background .2s}
.nav button svg{width:18px;height:18px;color:var(--muted);flex:none}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.sb-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 10px 6px}
.jsteps{display:flex;flex-direction:column;gap:2px}
.jstep{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:center;border:0;background:none;border-radius:10px;padding:6px 8px;text-align:left;font-size:13px;transition:background .2s}
.jstep:hover{background:var(--surface-2)}
.jstep .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);transition:all .3s}
.jstep.done{color:var(--muted)}
.jstep.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.jstep.next .n{border-color:var(--accent);color:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.linkbtn{border:0;background:none;padding:4px 10px;color:var(--accent);font-weight:500;font-size:13px;text-align:left;text-decoration:none}
.mobilebox{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.mobilebox b{color:var(--ink);font-size:13px}
.mobilebox a{color:var(--accent);font-weight:500;text-decoration:none}

.main{min-width:0;padding:26px max(30px,env(safe-area-inset-right,0px)) 60px 34px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.hd h1{margin:0;font-weight:300;font-size:17px;line-height:1.2}
.hd h1 b{display:block;font-weight:600;font-size:34px;letter-spacing:-.025em;margin-top:2px}
.hd p{margin:6px 0 0;color:var(--muted)}
.hd-r{display:flex;align-items:center;gap:10px}
.datechip{font-size:13px;color:var(--muted)}
.icbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.icbtn svg{width:17px;height:17px}
.icbtn .badge{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--surface)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--g-green);display:grid;place-items:center;font-weight:600;font-size:13px;border:1px solid var(--line)}

.view.enter>*{animation:rise .5s var(--ease) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px 19px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;min-width:0}
.card.green{background:var(--g-green)}.card.peach{background:var(--g-peach)}.card.pink{background:var(--g-pink)}.card.blue{background:var(--g-blue)}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;font-weight:500;position:relative;z-index:1}
.ct .sub{color:var(--muted);font-weight:400;font-size:12.5px}
.ct>svg{width:18px;height:18px;color:var(--muted)}
.big{font-weight:400;font-size:42px;letter-spacing:-.035em;line-height:1;position:relative;z-index:1}
.big small{font-size:15px;letter-spacing:0;color:var(--muted);margin-left:4px}
.unit,.small{font-size:12.5px;color:var(--muted);position:relative;z-index:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);align-self:flex-start;position:relative;z-index:1;white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.deco{position:absolute;right:-40px;top:0;width:200px;height:200px;opacity:.5;pointer-events:none}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s;position:relative;z-index:1}
.btn:active{transform:scale(.98)}
.btn:hover:not(:disabled){opacity:.9}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.crit{background:var(--crit);color:#fff;overflow:hidden}
.btn.crit::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.4s 1s infinite}
@keyframes sheen{40%,100%{transform:translateX(100%)}}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.tgl{display:flex;align-items:center;gap:10px;font-size:14px;margin:12px 0 10px;cursor:pointer;position:relative;z-index:1}.tgl input{position:absolute;opacity:0;pointer-events:none}.tgl .sw{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}.tgl .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}.tgl input:checked+.sw{background:var(--accent)}.tgl input:checked+.sw::after{transform:translateX(16px)}.tgl input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn svg{width:17px;height:17px}

/* overview grid */
.g-over{display:grid;gap:14px;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));grid-template-areas:"hero self gap ops" "hero sales np cb" "envs envs tx tx"}
.a-hero{grid-area:hero}.a-self{grid-area:self}.a-gap{grid-area:gap}.a-ops{grid-area:ops}.a-sales{grid-area:sales}.a-np{grid-area:np}.a-cb{grid-area:cb}.a-envs{grid-area:envs}.a-tx{grid-area:tx}
.g-over>.card{min-height:186px}
.hero svg.donut{width:100%;height:auto;display:block;overflow:visible}
.glow{position:absolute;inset:20% 14% 22%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ok) 26%,transparent),transparent),radial-gradient(closest-side at 70% 70%,color-mix(in srgb,var(--warn) 20%,transparent),transparent);filter:blur(22px);pointer-events:none;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);opacity:.8}}
.spark{width:100%;height:60px;display:block;margin-top:auto;position:relative;z-index:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bars{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:auto}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--pending);transform-origin:bottom;animation:barup .7s var(--ease) both}
.bars i.today{background:var(--accent)}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.days{display:flex;gap:5px;font-size:10.5px;color:var(--muted)}.days span{flex:1;text-align:center}
.minilist{display:flex;flex-direction:column;gap:5px;position:relative;z-index:1;margin-top:auto}
.minilist div{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.minilist span{color:var(--muted)}
.envrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.envmini{border:1px solid var(--line);border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:left}
.envmini .t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.envmini b{font-size:17px;font-weight:500;letter-spacing:-.01em}
.dotc{width:8px;height:8px;border-radius:3px;display:inline-block;flex:none}
.bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s var(--ease)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:36px 1fr auto;gap:11px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.li .t{font-size:13.5px;font-weight:500;line-height:1.25}.li .s{font-size:12px;color:var(--muted)}
.amt{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}.amt.in{color:var(--ok)}.amt.neg{color:var(--crit)}
.li.new{animation:newrow 1.6s var(--ease)}
@keyframes newrow{0%{background:var(--accent-soft)}100%{background:transparent}}

/* envelopes page */
.g-env{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.gchips{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.gchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;transition:all .25s}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.taxline{font-size:12.5px;background:var(--warn-soft);border-radius:12px;padding:9px 12px;position:relative;z-index:1}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:5px 0;font-size:13.5px;position:relative;z-index:1}
.prow input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.prow .v{font-weight:600;font-variant-numeric:tabular-nums}
.selfline{display:flex;justify-content:space-between;font-weight:600;color:var(--ok);position:relative;z-index:1}
.selfline.bad{color:var(--crit)}
.split{display:flex;height:40px;border-radius:12px;overflow:hidden;gap:3px;position:relative;z-index:1}
.split i{display:grid;place-items:center;height:100%;font-style:normal;font-size:11.5px;font-weight:600;color:rgba(0,0,0,.55);overflow:hidden;white-space:nowrap;transition:flex-grow .45s var(--ease)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);position:relative;z-index:1}
.field input{font:inherit;font-size:20px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.envgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.env{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .25s var(--ease),box-shadow .3s;min-height:150px}
.env .top{display:flex;justify-content:space-between;align-items:center}
.env .nm{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.env .pc{font-size:12px;color:var(--muted)}
.env b{font-size:25px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.env .gl{font-size:12px;color:var(--muted);line-height:1.35;margin-top:auto}
.env .plus{position:absolute;right:14px;top:40px;font-size:14px;font-weight:600;color:var(--ok);opacity:0}
.env.bump{transform:scale(1.03);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.env.bump .plus{animation:plus 1.3s var(--ease)}
@keyframes plus{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.paybanner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--surface);animation:rise .4s var(--ease);position:relative;z-index:1}
.paybanner .coin{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.paybanner .t{font-size:12px;opacity:.75}.paybanner b{font-size:19px;font-weight:500}
.flychip{position:fixed;left:0;top:0;z-index:80;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;pointer-events:none;white-space:nowrap;box-shadow:0 6px 14px -6px rgba(0,0,0,.4)}
.hint{font-size:13px;border-radius:12px;padding:10px 12px;background:var(--warn-soft);position:relative;z-index:1}
.note{font-size:12px;color:var(--muted);margin:0;position:relative;z-index:1}

/* radar */
.g-radar{display:grid;gap:14px;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);align-items:start}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{width:16px;height:0;border-top:2px solid var(--blue);display:inline-block;margin-right:6px;vertical-align:middle}
.scan{position:relative;display:grid;place-items:center;height:140px}
.scan i{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 1.6s ease-out infinite}
.scan i:nth-child(2){animation-delay:.5s}.scan i:nth-child(3){animation-delay:1s}
.scan b{position:relative;width:14px;height:14px;border-radius:50%;background:var(--accent)}
@keyframes ring{from{opacity:.8;transform:scale(.4)}to{opacity:0;transform:scale(3.4)}}

/* ops table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.srcb{display:inline-flex;align-items:center;gap:8px}
.srcb .ic{width:28px;height:28px;border-radius:9px;font-size:9.5px}
.tblwrap{overflow-x:auto}
.mini-split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;min-width:120px}
.mini-split i{display:block;height:100%}

/* integrations */
.g-int{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.int .head{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.int .ic{width:42px;height:42px;border-radius:13px;font-size:12px}
.int b{font-size:15px;font-weight:600}
.state{font-size:12px;font-weight:500}

/* overlays */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.38);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .22s both}
.modal.closing{animation:fadeout .22s both}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.panel{width:min(460px,100%);max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -20px var(--shadow);animation:zoom .35s var(--ease) both}
.modal.closing .panel{animation:zoomout .22s ease-in both}
@keyframes zoom{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes zoomout{to{opacity:0;transform:translateY(10px) scale(.98)}}
.panel.swap>*{animation:rise .3s var(--ease) both}
.panel h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em}
.lbl{font-size:12px;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){font-weight:500;text-align:right}
.stp{display:flex;gap:6px}
.stp i{flex:1;height:4px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.stp i.on::after{content:"";position:absolute;inset:0;background:var(--accent);animation:fillx .5s var(--ease) both}
@keyframes fillx{from{transform:translateX(-100%)}to{transform:none}}
.checks{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.checks div{display:flex;align-items:center;gap:10px;font-size:14px;opacity:.35;transition:opacity .3s}
.checks div.busy,.checks div.done{opacity:1}
.checks .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.checks div.done .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.checks div.busy .c{border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.success{width:62px;height:62px;align-self:center}
.success circle,.success path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s var(--ease) forwards}
.success path{animation-delay:.45s}
.push{position:fixed;right:max(22px,env(safe-area-inset-right,0px));top:calc(20px + env(safe-area-inset-top,0px));z-index:70;width:min(380px,calc(100vw - 32px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:38px 1fr;gap:11px;box-shadow:0 18px 40px -18px var(--shadow);text-align:left;animation:pushIn .5s var(--ease) both;cursor:pointer}
.push.out{animation:pushOut .3s ease-in both}
@keyframes pushIn{from{transform:translateY(-150%)}to{transform:none}}
@keyframes pushOut{to{transform:translateY(-150%);opacity:0}}
.push .pi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#2AABEE;color:#fff}
.push .pi svg{width:20px;height:20px}
.push .h{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.push .b{font-size:13.5px;font-weight:500;line-height:1.35;display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:75;background:var(--ink);color:var(--surface);border-radius:99px;padding:10px 18px;font-size:13.5px;white-space:nowrap;animation:rise .3s var(--ease)}
.hl{animation:hl 2s var(--ease)}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 transparent}15%,70%{box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 70%,transparent)}}

@media (max-width:1240px){
  .g-over{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"hero self gap" "hero ops sales" "np cb tx" "envs envs tx"}
  .envrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g-int{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .sb{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-left,0px))}
  .sb .jsteps,.sb .sb-h,.sb-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto}
  .brand{padding-bottom:10px}
  .main{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .g-over{grid-template-columns:1fr 1fr;grid-template-areas:"hero hero" "self gap" "ops sales" "np cb" "envs envs" "tx tx"}
  .g-env,.g-radar{grid-template-columns:1fr}
  .envgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .g-over{grid-template-columns:1fr;grid-template-areas:"hero" "self" "gap" "ops" "sales" "np" "cb" "envs" "tx"}
  .envrow{grid-template-columns:1fr 1fr}
  .g-int{grid-template-columns:1fr}
  .hd h1 b{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* особистий кабінет (демо-вхід) */
.auth{position:fixed;inset:0;z-index:90;background:var(--app,var(--panel));display:flex;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));animation:fade .25s both;overflow-y:auto}
.auth.closing{animation:fadeout .25s both}
.authbox{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.authbox .logo{width:56px;height:56px;border-radius:16px}
.authbox h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.authbox p{margin:0;color:var(--muted);font-size:13.5px}
.authbox .f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.authbox .f input{font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
.authbox .f input.code{letter-spacing:.5em;text-align:center;font-size:24px}
.authbox .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.authbox .dots{display:flex;gap:6px}.authbox .dots i{flex:1;height:4px;border-radius:99px;background:var(--line)}.authbox .dots i.on{background:var(--accent)}
.authbox .back{border:0;background:none;color:var(--muted);font-size:13px;text-align:left;padding:0}
.authbox .demo{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 11px}
.avatar{cursor:pointer;border:1px solid var(--line);font-family:inherit;color:var(--ink)}
.profrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.profrow:first-of-type{border-top:0}.profrow span{color:var(--muted)}
.profhead{display:flex;gap:12px;align-items:center}.profhead .avatar{width:52px;height:52px;font-size:16px;cursor:default}
</style>
</head>
<body>
<div class="shell">
  <aside class="sb">
    <div class="brand"><img src="../icons/icon-192.png" alt="">Фінансист у кишені</div>
    <nav class="nav" id="nav" aria-label="Розділи"></nav>
    <div class="sb-h">Сценарій для журі</div>
    <div class="jsteps" id="jsteps"></div>
    <div class="sb-foot">
      <button class="linkbtn" id="reset">↺ Скинути демо до початку</button>
      <div class="mobilebox"><b>Мобільний застосунок</b>Та сама логіка й ті самі дані, але як апка на телефоні. <a href="../">Відкрити мобільну версію →</a></div>
    </div>
  </aside>
  <main class="main">
    <header class="hd">
      <div><h1>Привіт,<b data-hello=".">Олено.</b></h1><p id="hd-sub"></p></div>
      <div class="hd-r"><span class="datechip" id="date"></span>
        <button class="btn accent sm" id="pay-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg>Вхідний платіж</button>
        <button class="icbtn" id="bell" aria-label="Сповіщення"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="badge" hidden></span></button>
        <button class="avatar" data-avatar aria-label="Профіль">ОК</button></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="layer"></div>

<script>
(function(){
"use strict";
/* ======================================================================
   СПІЛЬНА МОДЕЛЬ (та сама, що в мобільній версії; стан у localStorage спільний)
   ====================================================================== */
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('uk-UA')+' ₴';
const fmtn=n=>Math.round(n).toLocaleString('uk-UA');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WD=['нд','пн','вт','ср','чт','пт','сб'],MONTHS=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const today=new Date();today.setHours(0,0,0,0);
const dayAt=i=>{const d=new Date(today);d.setDate(d.getDate()+i);return d};
const dm=i=>{const d=dayAt(i);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')};
const wd=i=>WD[dayAt(i).getDay()];
const inDays=i=>i===0?'сьогодні':i===1?'завтра':`через ${i} ${i<5?'дні':'днів'}`;
$('date').textContent=`${WD[today.getDay()]}, ${today.getDate()} ${MONTHS[today.getMonth()]} ${today.getFullYear()}`;

const ENVS=[
  {k:'tax', n:'Податки',          c:'var(--warn)',  goal:70200, gl:'єдиний податок + військовий збір за III квартал, до 19.11'},
  {k:'buy', n:'Закупівля товару', c:'var(--accent)',goal:52000, gl:'партія у фабрики взуття «Крок» через 13 днів'},
  {k:'ops', n:'Операційні',       c:'var(--blue)',  goal:40000, gl:'оренда складу 40 000 ₴ '+inDays(2)},
  {k:'mkt', n:'Маркетинг',        c:'var(--violet)',goal:18000, gl:'реклама Meta через 10 днів'},
  {k:'res', n:'Резерв',           c:'var(--teal)',  goal:60000, gl:'подушка на 1 місяць витрат'},
  {k:'self',n:'Собі',             c:'var(--ok)',    goal:0,     gl:'можна вивести без попередження'},
];
const SALES_DAY=13000;
const OPS_PAYS=[{d:2,t:'Оренда складу',a:40000},{d:14,t:'Зарплата помічниці',a:15000},{d:19,t:'Тариф Prom.ua',a:4500}];
const OD_RATE=.24,OD_SHARE=.30;
const DEF={group:'3',pct:{buy:50,ops:12,mkt:15,res:5},bal:{tax:51426,buy:38400,ops:18880,mkt:9600,res:12000,self:6800},
  tx:[{src:'Checkbox',t:'Каса в магазині, 3 чеки',a:4180,ago:'сьогодні 12:40'},{src:'NovaPay',t:'Кросівки «Ран», 41',a:3100,ago:'сьогодні 11:05'},{src:'Нова пошта',t:'Післяплата, ТТН 2045…118',a:2800,ago:'сьогодні 09:52'},{src:'LiqPay',t:'Лофери «Ліра», 37',a:2800,ago:'вчора 21:17'}],
  od:0,debt:0,unalloc:0,autoRepay:true,done:{},alert:false};
let S;
const load=()=>{try{const j=JSON.parse(localStorage.getItem('fk-state')||'null');if(j&&j.v===3)return j.s}catch(e){}return null};
const save=()=>{try{localStorage.setItem('fk-state',JSON.stringify({v:3,s:S}))}catch(e){}};
S=load()||JSON.parse(JSON.stringify(DEF));
S.unalloc=S.unalloc||0;if(S.debt===undefined)S.debt=S.od||0;if(S.autoRepay===undefined)S.autoRepay=true;
addEventListener('storage',e=>{if(e.key==='fk-state'){const n=load();if(n){S=n;S.unalloc=S.unalloc||0;if(S.debt===undefined)S.debt=S.od||0;if(S.autoRepay===undefined)S.autoRepay=true;render(false);if(typeof paintUser==='function')paintUser()}}});   // зміни з мобільної версії в іншій вкладці
const taxPct=g=>(g||S.group)==='3'?6:(g||S.group)==='3v'?4:0;
const selfPct=()=>100-taxPct()-S.pct.buy-S.pct.ops-S.pct.mkt-S.pct.res;
const pctOf=k=>k==='tax'?taxPct():k==='self'?Math.max(0,selfPct()):S.pct[k];
const total=()=>Object.values(S.bal).reduce((a,b)=>a+b,0)+(S.unalloc||0);   // усе, що лежить на рахунку ФОП: конверти + ще не розподілене
const repayOf=a=>S.autoRepay?Math.min(S.debt||0,Math.round(a*OD_SHARE)):0;            // погашення овердрафту списується до поділу по конвертах
function forecast(x){x=x||{};
  const k=S.pct.ops/100;let debt=(S.debt||0)+(x.debt||0);const pend=(S.unalloc||0)-repayOf(S.unalloc||0);debt-=repayOf(S.unalloc||0);
  let b=S.bal.ops+pend*k+(x.ops||0);const days=[];let inflow0=null;
  for(let i=0;i<30;i++){const pays=OPS_PAYS.filter(p=>p.d===i);const low=b-pays.reduce((a,p)=>a+p.a,0);
    const rp=S.autoRepay?Math.min(debt,SALES_DAY*OD_SHARE):0;debt-=rp;const inflow=(SALES_DAY-rp)*k;if(inflow0===null)inflow0=inflow;b=low+inflow;days.push({i,low,end:b,pays})}
  const inflow=inflow0;
  const g=days.find(d=>d.low<0);   // овердрафт береться рівно на дефіцит першого розриву (специфікація команди)
  return{days,gap:g?{i:g.i,need:-g.low,first:-g.low,pay:g.pays[0]}:null,inflow};
}
const odAmount=g=>{let X=Math.ceil(g.need/100)*100;for(let i=0;i<200;i++){const f=forecast({ops:X,debt:X});if(f.days[g.i].low>=0)return X;X+=100}return X};
const odDays=a=>Math.max(1,Math.ceil(a/(SALES_DAY*OD_SHARE)));

/* ======================================================================
   ICONS
   ====================================================================== */
const IC={
 over:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 env:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/>',
 radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/>',
 ops:'<path d="M4 7h16M4 12h16M4 17h10"/>',
 int:'<path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0z"/><path d="M12 16v5"/>',
 card:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
 tg:'<path d="M21 4L3 11l6 2 2 6 3-4 5 4z" fill="currentColor" stroke="none"/>',
 box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 bolt:'<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',
 arrow:'<path d="M7 17L17 7M9 7h8v8"/>'
};
const ic=(k,w=1.8)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const SRC={Checkbox:['CB','var(--surface-2)','var(--muted)'],'Вчасно.Каса':['ВК','var(--surface-2)','var(--muted)'],NovaPay:['NP','#E9F1FE','#2B6CD9'],'Нова пошта':['НП','#FDE8E8','#D1342A'],LiqPay:['LQ','#E7F5EA','#1F8A45'],WayForPay:['WFP','#E8ECFB','#3A55C8'],'Імітація':['SIM','var(--surface-2)','var(--muted)'],Raiffeisen:['RB','#FFF6CC','#7A6400']};
const srcIc=s=>{const x=SRC[s]||['··','var(--surface-2)','var(--muted)'];return `<span class="ic" style="background:${x[1]};color:${x[2]}">${x[0]}</span>`};
const lastNum={};
function countUp(el,to,key){if(!el)return;const from=lastNum[key]??to;lastNum[key]=to;if(RM||from===to){el.textContent=fmtn(to);return}
  const t0=performance.now(),dur=900;(function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmtn(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
const rings=c=>`<svg class="deco" viewBox="0 0 200 200" fill="none" stroke="${c}" stroke-width="1">${[90,72,54,36].map(r=>`<circle cx="100" cy="100" r="${r}" opacity="${(1-r/120).toFixed(2)}"/>`).join('')}</svg>`;
function flash(id){const el=$(id);if(!el)return;el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl');const r=el.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)el.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'})}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('layer').appendChild(d);setTimeout(()=>d.remove(),2300)}

/* ======================================================================
   NAV + RENDER
   ====================================================================== */
const PAGES=[['over','Огляд','over','Ось ваші гроші на сьогодні. ФОП 3 група, взуттєвий магазин «Крок»: Instagram, Prom і магазин.'],['env','Конверти','env','Задайте відсотки, і кожне надходження розкладеться по конвертах автоматично.'],['radar','Платіжний радар','radar','Прогноз конверта «Операційні» на 30 днів і перевірка касових розривів.'],['ops','Операції','ops','Усі надходження з еквайрингу, пошти й кас і як вони розподілені.'],['int','Інтеграції','int','Звідки сервіс бере дані. Вручну нічого вносити не треба.']];
$('nav').innerHTML=PAGES.map(([k,n,i])=>`<button data-page="${k}">${ic(i)}${n}</button>`).join('');
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
let page='over';
function go(p,anim=true){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.dataset.page===p?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));$('hd-sub').textContent=PAGES.find(x=>x[0]===p)[3];render(anim);scrollTo({top:0,behavior:'auto'});try{history.replaceState(null,'','#'+p)}catch(e){}}
function render(anim){
  $('view').innerHTML=`<div class="view${anim?' enter':''}">${({over:overHTML,env:envHTML,radar:radarHTML,ops:opsHTML,int:intHTML})[page]()}</div>`;
  ({over:overAfter,env:envAfter,radar:radarAfter,ops:()=>{},int:()=>{}})[page]();
  $('badge').hidden=!S.alert;paintSteps();save();
}

/* ---------- ОГЛЯД ---------- */
const WEEK=[21380,18940,25300,19870,23410,31200];
function donut(){
  const W=420,H=330,cx=210,cy=165,r=92,tot=total()||1;let off=0,segs='';const lab=[];
  const PARTS=ENVS.concat(S.unalloc>0?[{k:'_u',n:'Не розподілено',c:'var(--pending)'}]:[]);
  PARTS.forEach(e=>{const v=e.k==='_u'?S.unalloc:S.bal[e.k],p=v/tot*100;segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${e.c}" stroke-width="20" pathLength="100" stroke-dasharray="${Math.max(0,p-1.2)} 100" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"/>`;
    const mid=(off+p/2)/100*2*Math.PI-Math.PI/2;lab.push({e,v,mid});off+=p});
  // три найбільші конверти отримують виноски з лініями, щоб нічого не накладалось
  const top=[...lab].sort((a,b)=>b.v-a.v).slice(0,3);const used={};
  const call=top.map(l=>{const px=cx+r*Math.cos(l.mid),py=cy+r*Math.sin(l.mid);let right=Math.cos(l.mid)>=0,up=Math.sin(l.mid)<0;const key=()=>(right?'r':'l')+(up?'t':'b');if(used[key()]){up=!up;if(used[key()])right=!right}used[key()]=1;
    const lx=right?W-2:2,ly=up?24:H-34;return `<path d="M${px.toFixed(1)},${py.toFixed(1)} L${right?W-70:70},${up?ly+26:ly-20} H${lx}" fill="none" stroke="var(--muted)" stroke-width="1" opacity=".5"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="7" fill="var(--surface)" stroke="${l.e.c}" stroke-width="2"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.6" fill="${l.e.c}"/>
    <text x="${lx}" y="${up?ly-6:ly+6}" text-anchor="${right?'end':'start'}" font-size="13.5" fill="var(--muted)">${l.e.n}</text><text x="${lx}" y="${up?ly+16:ly+28}" text-anchor="${right?'end':'start'}" font-size="20" font-weight="500" fill="var(--ink)">${fmtn(l.v)} <tspan font-size="12" fill="var(--muted)">₴</tspan></text>`}).join('');
  return `<svg class="donut" viewBox="0 0 ${W} ${H}" role="img" aria-label="Гроші бізнесу по конвертах"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="20"/><circle cx="${cx}" cy="${cy}" r="${r-26}" fill="none" stroke="var(--line)" stroke-dasharray="1.5 4"/>${segs}
   <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="12" fill="var(--muted)">гроші бізнесу</text><text x="${cx}" y="${cy+20}" text-anchor="middle" font-size="30" font-weight="500" fill="var(--ink)" id="tot">${fmtn(tot)}</text>${call}</svg>`;
}
function spark(f){const vs=[S.bal.ops];f.days.slice(0,14).forEach(d=>vs.push(d.low,d.end));const W=240,H=60,mn=Math.min(0,...vs),mx=Math.max(...vs),X=i=>i/(vs.length-1)*W,Y=v=>4+(H-8)*(mx-v)/(mx-mn||1);
  const d=vs.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${mn<0?`<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--crit)" stroke-dasharray="3 3" opacity=".6"/>`:''}<path d="${d}" fill="none" stroke="var(--blue)" stroke-width="1.8" vector-effect="non-scaling-stroke" pathLength="1" class="draw"/></svg>`}
function overHTML(){
  const f=forecast(),g=f.gap,week=WEEK.concat([S.todaySales||14760]),mx=Math.max(...week);

function md5bytes(bytes){
  const K=new Int32Array(64),r=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const len=bytes.length,nb=((len+8)>>>6)+1,w=new Int32Array(nb*16);
  for(let i=0;i<len;i++)w[i>>2]|=bytes[i]<<((i%4)*8);w[len>>2]|=0x80<<((len%4)*8);w[nb*16-2]=len*8;
  let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  for(let j=0;j<w.length;j+=16){let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){let F,g;if(i<16){F=(B&C)|(~B&D);g=i}else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}else if(i<48){F=B^C^D;g=(3*i+5)%16}else{F=C^(B|~D);g=(7*i)%16}
      const tmp=D;D=C;C=B;const x=(A+F+K[i]+w[j+g])|0;B=(B+((x<<r[i])|(x>>>(32-r[i]))))|0;A=tmp}
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0}
  const out=new Uint8Array(16);[a0,b0,c0,d0].forEach((v,i)=>{for(let k=0;k<4;k++)out[i*4+k]=(v>>>(k*8))&255});return out;
}
function hmacMD5(key,msg){const enc=new TextEncoder();let k=enc.encode(key);if(k.length>64)k=md5bytes(k);const kp=new Uint8Array(64);kp.set(k);
  const ip=kp.map(b=>b^0x36),op=kp.map(b=>b^0x5c),m=enc.encode(msg);
  return [...md5bytes(new Uint8Array([...op,...md5bytes(new Uint8Array([...ip,...m]))]))].map(b=>b.toString(16).padStart(2,'0')).join('')}

      :`<div class="card green" id="c-radar">${rings('var(--accent)')}<div class="ct">Платіжний радар<span class="chip">усе покрито</span></div><div class="small">${S.debt>0?'На 30 днів уперед розривів немає.':S.od?'Овердрафт погашено. На 30 днів уперед розривів немає.':'На 30 днів уперед розривів немає.'}</div></div>`}</div>${odBoxHTML()}

function chartSVG(f){
  const W=680,H=300,pl=46,pr=12,pt=18,pb=30,N=30,dx=(W-pl-pr)/N;
  const vs=[S.bal.ops];f.days.forEach(d=>vs.push(d.low,d.end));
  let mn=Math.min(0,...vs),mx=Math.max(...vs);const st=mx-mn>120000?40000:20000;mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
  const X=i=>pl+dx*i,Y=v=>pt+(H-pt-pb)*(mx-v)/(mx-mn),y0=Y(0);
  let d=`M${X(0)},${Y(vs[0])}`;f.days.forEach((x,i)=>{d+=`L${X(i).toFixed(1)},${Y(x.low).toFixed(1)}L${X(i+1).toFixed(1)},${Y(x.end).toFixed(1)}`});
  let grid='';for(let v=mn;v<=mx;v+=st)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v/1000}k</text>`;
  let xt='';for(let i=0;i<N;i+=3)xt+=`<text x="${X(i)+dx/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${dm(i)}</text>`;
  let marks='';f.days.forEach(x=>{if(x.pays.length)marks+=`<circle cx="${X(x.i)}" cy="${Y(x.low)}" r="${x.low<0?5:3.5}" fill="${x.low<0?'var(--crit)':'var(--surface)'}" stroke="${x.low<0?'var(--surface)':'var(--ink)'}" stroke-width="1.5"/>`});
  const g=f.gap;const gm=g?`<rect x="${Math.min(X(g.i)+9,W-62)}" y="${Y(-g.first)-10}" width="54" height="20" rx="10" fill="var(--crit)"/><text x="${Math.min(X(g.i)+9,W-62)+27}" y="${Y(-g.first)+4}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">−${(Math.round(g.first/100)/10).toLocaleString('uk-UA')}k</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Прогноз залишку в конверті Операційні на 30 днів"><defs><clipPath id="cp"><rect x="0" y="-10" width="${W}" height="${y0+10}"/></clipPath><clipPath id="cn"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath>
   <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".26"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
   ${grid}<rect x="${pl}" y="${y0}" width="${W-pl-pr}" height="${Math.max(0,Y(mn)-y0)}" fill="var(--crit-soft)" opacity=".8"/>
   <line x1="${X(0)}" x2="${X(0)}" y1="${pt-6}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${X(0)+5}" y="${pt-6}" font-size="11" fill="var(--muted)">сьогодні</text>
   <path d="${d}L${X(N)},${y0}L${X(0)},${y0}Z" fill="url(#ga)" clip-path="url(#cp)"/>
   <path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2.2" clip-path="url(#cp)" pathLength="1" class="draw"/>
   <path d="${d}" fill="none" stroke="var(--crit)" stroke-width="2.2" clip-path="url(#cn)" pathLength="1" class="draw"/>${marks}${gm}${xt}</svg>`;
}

  if(step==='phone')authEl.innerHTML=`<div class="authbox">${logo}${dots(1)}<h2>Вхід у Фінансист</h2><p>Особистий кабінет ФОПа: конверти, платежі й радар. Дані бачите тільки ви.</p>
    <label class="f" for="a-phone">Номер телефону<input id="a-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380 67 000 00 00" value="${prettyPhone(P.phone)}"></label>
    <button class="btn accent" id="a-next" disabled>Отримати код</button><div class="demo">Демо-вхід: SMS не надсилаються, акаунти не створюються на сервері.</div></div>`;
  if(step==='code')authEl.innerHTML=`<div class="authbox">${logo}${dots(2)}<button class="back" id="a-back">← ${prettyPhone(authEl.dataset.phone)}</button><h2>Код з SMS</h2><p>Введіть 4 цифри з повідомлення.</p>
    <label class="f" for="a-code">Код<input id="a-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="····"></label>
    <div class="demo">У демо підходить будь-який код з 4 цифр.</div></div>`;
  if(step==='profile')authEl.innerHTML=`<div class="authbox">${logo}${dots(3)}<h2>${edit?'Ваші дані':'Кілька слів про вас'}</h2><p>Група ФОП потрібна, щоб податок підтягувався автоматично.</p>
    <div class="two"><label class="f" for="a-name">Ім’я<input id="a-name" autocomplete="given-name" value="${edit?(P.name||''):''}"></label><label class="f" for="a-last">Прізвище<input id="a-last" autocomplete="family-name" value="${edit?(P.last||''):''}"></label></div>
    <label class="f" for="a-shop">Назва магазину<input id="a-shop" value="${edit?(P.shop||''):''}"></label>
    <div class="f">Група ФОП<div class="gchips" id="a-group">${GROUPS.map(([v,n])=>`<button class="gchip" data-g="${v}" aria-pressed="${S.group===v}">${n}</button>`).join('')}</div></div>
    <button class="btn accent" id="a-save" disabled>${edit?'Зберегти':'Перейти до кабінету'}</button>${edit?'<button class="btn ghost" id="a-cancel">Скасувати</button>':''}</div>`;
  const $a=id=>authEl.querySelector('#'+id);
  if(step==='phone'){const i=$a('a-phone'),b=$a('a-next');const chk=()=>{b.disabled=digits(i.value).length<10};i.oninput=chk;chk();
    b.onclick=()=>{let d=digits(i.value);if(d.length===10)d='38'+d;authEl.dataset.phone=d;openAuth('code')};i.onkeydown=e=>{if(e.key==='Enter'&&!b.disabled)b.click()};setTimeout(()=>i.focus(),50)}
  if(step==='code'){const i=$a('a-code');$a('a-back').onclick=()=>openAuth('phone');setTimeout(()=>i.focus(),50);
    i.oninput=()=>{i.value=digits(i.value).slice(0,4);if(i.value.length===4){const d=authEl.dataset.phone;if(S.profile&&digits(S.profile.phone)===d&&S.profile.name){S.auth=true;finishAuth()}else{S.profile={phone:d};openAuth('profile')}}}}
  if(step==='profile'){let g=S.group;const sv=$a('a-save');const chk=()=>{sv.disabled=!($a('a-name').value.trim()&&$a('a-shop').value.trim())};['a-name','a-last','a-shop'].forEach(id=>$a(id).oninput=chk);chk();
    authEl.querySelectorAll('.gchip').forEach(b=>b.onclick=()=>{g=b.dataset.g;authEl.querySelectorAll('.gchip').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    sv.onclick=()=>{S.profile=Object.assign({},S.profile,{name:$a('a-name').value.trim(),last:$a('a-last').value.trim(),shop:$a('a-shop').value.trim()});S.group=g;S.auth=true;finishAuth()};
    const c=$a('a-cancel');if(c)c.onclick=closeAuth;setTimeout(()=>$a('a-name').focus(),50)}
}
function closeAuth(){if(!authEl)return;const el=authEl;authEl=null;el.classList.add('closing');setTimeout(()=>el.remove(),250)}
function finishAuth(){save();paintUser();closeAuth();(()=>render(false))();toast('Вітаємо, '+voc(S.profile.name)+'!')}
function logout(){S.auth=false;save();(()=>{closeModal();hidePush()})();openAuth('phone')}
function openProfile(){const p=S.profile||{};const g=(GROUPS.find(x=>x[0]===S.group)||['','—'])[1];
  ((h,l)=>openModal(h,l))(`<div class="profhead"><span class="avatar">${initials(p)}</span><div><h3 style="margin:0">${p.name||''} ${p.last||''}</h3><div class="small">ФОП, магазин «${p.shop||''}»</div></div></div>
   <div><div class="profrow"><span>Телефон</span><b>${prettyPhone(p.phone)}</b></div><div class="profrow"><span>Група ФОП</span><b>${g}</b></div><div class="profrow"><span>Податок</span><b>${S.group==='12'?'фіксований щомісяця':S.group==='3v'?'3% + 1%':'5% + 1%'}</b></div><div class="profrow"><span>Дані зберігаються</span><b>у цьому браузері</b></div></div>
   <button class="btn ghost" id="pf-edit">Змінити дані</button><button class="btn" id="pf-out">Вийти</button>`,'Профіль');
  document.getElementById('pf-edit').onclick=()=>{(()=>{closeModal();hidePush()})();openAuth('profile',true)};document.getElementById('pf-out').onclick=logout}
document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=openProfile);
paintUser();

S.done.dash=true;
const h=location.hash.slice(1);go(PAGES.some(p=>p[0]===h)?h:'over');
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==page&&PAGES.some(p=>p[0]===h))go(h)});if(!S.auth)openAuth('phone');
})();
</script>
</body>
</html>
