<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Targo</title>
<meta name="description" content="Targo: гуртовий постачальник дає ФОП-покупцю розстрочку за накладною під гроші, що вже їдуть до його покупців. Мобільна версія.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E100F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Targo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* мобільна версія: обидва кабінети в одному телефоні, перемикач ролей угорі. На комп'ютері телефон у рамці, поруч панель сценарію */
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px 24px}
#jury-open{display:none}
#sup,#buy{flex:1;min-height:0}
body.role-sup #buy,body.role-buy #sup{display:none}
.push{top:52px}
#pushhost .toast{bottom:90px}
@media (max-width:820px), (display-mode: standalone){
  body{background:var(--app)}
  .presenter,.pshow{display:none}
  #jury-open{display:block}
  .stage{display:block;padding:0}
  .device{width:100%;height:100dvh;min-height:0;border-radius:0;padding:0;background:none;box-shadow:none}
  .device::before,.statusbar{display:none}
  .app{border-radius:0}
  .rolebar{padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .push{top:calc(8px + env(safe-area-inset-top,0px))}
}
</style>
</head>
<body class="role-sup">
<div class="stage">
  <aside class="presenter" id="presenter" aria-label="Демо для журі"></aside>
  <button class="pshow" id="p-show">Демо для журі</button>

  <div class="device">
    <div class="app" id="phone">
      <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sig"><i></i></span></div>
      <div class="rolebar">
        <span class="mode"><button data-role="sup" aria-pressed="true">Постачальник</button><button data-role="buy" aria-pressed="false">Покупець</button></span>
        <button class="linkbtn" id="jury-open">Сценарій</button>
      </div>

      <section class="sup" id="sup" aria-label="Кабінет постачальника">
        <header class="shd">
          <div class="brand"><span class="logo">T</span><span><b>ТОВ «Оселя-Опт»</b><small>гуртовня товарів для дому</small></span></div>
          <span class="today" id="s-today"></span>
        </header>
        <nav class="stabs" aria-label="Розділи постачальника">
          <button data-stab="new">Нова розстрочка</button><button data-stab="apps">Заявки</button><button data-stab="ar">Дебіторка</button><button data-stab="stmt">Виписка</button><button data-stab="docs">Документи</button>
        </nav>
        <main class="sbody" id="sbody"></main>
      </section>

      <section class="buy" id="buy" aria-label="Кабінет покупця">
        <header class="apphd">
          <span class="me"><span class="avatar">ОК</span><span><span class="nm">Олена Коваль</span><span class="sb">ФОП · «Затишок» · Паспорт селера</span></span></span>
        </header>
        <main class="scr" id="bscr"></main>
        <nav class="tabs" aria-label="Розділи покупця">
          <button data-btab="pass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.5 1.8-2.2 3.2-2.2s2.6.7 3.2 2.2M15 10h3M15 13.5h3"/></svg>Паспорт</button>
          <button data-btab="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 14h3"/></svg>Погашення</button>
          <button data-btab="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2M20 14v6h-6v-2M17 17h0"/></svg>Рахунки</button>
          <button data-btab="bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 3.3 6.5L4 20l1.3-3.4A8 8 0 0 1 4 12z"/><path d="M9 11h6M9 14h4"/></svg>Бот</button>
        </nav>
        <div id="blayer"></div>
      </section>
      <div id="pushhost"></div>
    </div>
  </div>
</div>

<div class="ovl" id="ovl" hidden></div>
<div class="subs" id="subs" hidden aria-live="polite"><span class="k" id="subs-k"></span><span id="subs-t"></span><i id="subs-bar"></i></div>
<div class="fcur" id="fcur" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
