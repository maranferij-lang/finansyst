<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Фінансист</title>
<meta name="description" content="Фінансист: конверти для ФОПа, розподіл кожного надходження, прогноз касового розриву і овердрафт банку-партнера.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E100F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Фінансист">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Кольори винесені в токени: палітру команди дизайну підставляємо тут, решта стилів не міняється */
:root{
  --page:#E4E6E2; --app:#F4F4F2; --surface:#FFFFFF; --surface-2:#EEEFEC; --ink:#141614; --muted:#6A706C; --faint:#A2A7A3; --line:#E3E5E1;
  --accent:#1E8C5A; --accent-ink:#FFFFFF; --accent-soft:#E2F1E9;
  --crit:#D03E30; --crit-soft:#FAE6E3; --warn:#B86E17; --warn-soft:#F9EEDD; --ok:#1E8C5A;
  --c-tax:#E0A23B; --c-buy:#3C78E8; --c-exp:#8460DE; --c-res:#1FA090; --c-self:#DB5C83;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --page:#090A09; --app:#0E100F; --surface:#171A18; --surface-2:#1F2320; --ink:#ECEFEC; --muted:#8F9792; --faint:#5C635F; --line:#262B28;
  --accent:#3FB57C; --accent-ink:#04110A; --accent-soft:#163122;
  --crit:#EE7466; --crit-soft:#3A1F1C; --warn:#E39E52; --warn-soft:#33261A; --ok:#3FB57C;
  --c-tax:#E7B157; --c-buy:#6D9BF2; --c-exp:#A88AEE; --c-res:#43BFAE; --c-self:#EA81A2; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
.btn:disabled{background:var(--surface-2);color:var(--muted);opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- комп'ютер: телефон по центру + панель демо збоку ---------- */
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px 24px}
.presenter{width:320px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.presenter .ph{display:flex;align-items:center;justify-content:space-between}
.presenter .ph b{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.pbox{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pbox h2{margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.jsteps{display:flex;flex-direction:column;gap:2px}
.jstep{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;border:0;background:none;border-radius:9px;padding:6px 6px;text-align:left;font-size:13.5px}
.jstep:hover{background:var(--surface-2)}
.jstep .n{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.jstep.done .n{background:var(--accent);color:var(--accent-ink)}
.jstep.next .n{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);background:var(--surface)}
.jstep.now{background:var(--surface-2)}
.jstep small{display:none}
.card-test{font-size:12.5px;color:var(--muted);line-height:1.45}
.card-test b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.qrrow{display:flex;gap:10px;align-items:center}
.qr{background:#fff;padding:5px;border-radius:8px;width:84px;height:84px;flex:none}
.qr img,.qr canvas{width:74px!important;height:74px!important;display:block}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:500;font-size:13.5px;text-align:left;text-decoration:none}
.mode{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;font-size:12.5px;align-self:flex-start}
.mode button{border:0;background:none;padding:4px 10px;border-radius:7px;color:var(--muted);font-weight:500}
.mode button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pshow{position:fixed;left:16px;bottom:16px;z-index:5;border:0;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.08)}
body.nopanel .presenter{display:none}

.device{width:390px;height:min(844px,calc(100vh - 56px));min-height:640px;border-radius:48px;padding:9px;background:#0C0D0C;box-shadow:0 30px 70px -30px rgba(0,0,0,.35);flex:none;position:relative}
.device::before{content:"";position:absolute;top:19px;left:50%;width:108px;height:30px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:50}
.app{position:relative;width:100%;height:100%;background:var(--app);border-radius:40px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.statusbar{height:48px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:14px;font-weight:600;flex:none}
.statusbar .sig{display:flex;gap:6px;align-items:center}
.statusbar .sig i{display:block;width:22px;height:11px;border-radius:3px;border:1.5px solid currentColor;position:relative;opacity:.9}
.statusbar .sig i::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;background:currentColor;border-radius:1px}
@media (max-width:820px), (display-mode: standalone){
  body{background:var(--app)}
  .stage{display:block;padding:0}
  .presenter,.pshow{display:none!important}
  .device{width:100%;height:100dvh;min-height:0;border-radius:0;padding:0;background:none;box-shadow:none}
  .device::before{display:none}
  .app{border-radius:0}
  .statusbar{display:none}
  .apphd{padding-top:calc(10px + env(safe-area-inset-top,0px))!important}
}

/* шапка */
.apphd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 16px 8px;flex:none}
.me{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:13px;border:0;flex:none}
.me .nm{display:block;font-size:15px;font-weight:600;line-height:1.15}
.me .sb{display:block;font-size:12.5px;color:var(--muted);line-height:1.2}
.hdr{display:flex;gap:4px;align-items:center}
.icbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;position:relative;flex:none;color:var(--ink)}
.icbtn:active{background:var(--surface-2)}
.icbtn svg{width:22px;height:22px}
.icbtn .badge{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--app)}

.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
.scr::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:12px}
.view.enter{animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* нижнє меню */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));flex:none;position:relative;z-index:5}
.tabs button{border:0;background:none;padding:5px 2px;font-size:11px;font-weight:500;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}

/* блоки */
.card,.blk{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.ct,.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;font-weight:600}
.ct .sub,.bh .sub{color:var(--muted);font-weight:400;font-size:13px}
.ct>svg{width:20px;height:20px;color:var(--faint);flex:none}
.big{font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.big small{font-size:17px;font-weight:500;color:var(--muted);margin-left:3px}
.small{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.grey{background:var(--surface-2);color:var(--muted)}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:600;font-size:15px;background:var(--ink);color:var(--surface);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.crit{background:var(--crit);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:9px 12px;border-radius:10px;font-size:14px}
.btn svg{width:18px;height:18px}
.btncol{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.altrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;padding:4px 0;cursor:pointer;position:relative}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.tgl .sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;order:2}
.tgl .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.tgl input:checked+.sw{background:var(--accent)}.tgl input:checked+.sw::after{transform:translateX(18px)}
.tgl input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}

/* головна */
.hero{padding:6px 2px 2px}
.hero .lab{font-size:13px;color:var(--muted)}
.hero .v{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.hero .v small{font-size:22px;font-weight:500;color:var(--muted);margin-left:4px}
.hero .d{font-size:13px;color:var(--accent);font-weight:500;margin-top:2px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 2px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink);padding:2px 0;line-height:1.15;text-align:center}
.qa .qi{width:50px;height:50px;border-radius:16px;background:var(--surface);display:grid;place-items:center}
.qa .qi svg{width:22px;height:22px}
.qa button.prim .qi{background:var(--ink);color:var(--surface)}
.note-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:11px 12px}
.note-row .ni{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.note-row .ni svg{width:19px;height:19px}
.note-row .t{font-size:14.5px;font-weight:600;line-height:1.25}
.note-row .s{font-size:13px;color:var(--muted);line-height:1.3}
.note-row.crit .ni{background:var(--crit-soft);color:var(--crit)}
.note-row.ok .ni{background:var(--accent-soft);color:var(--accent)}
.note-row.info .ni{background:var(--surface-2);color:var(--ink)}
.rows{display:flex;flex-direction:column}
.envpill{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;border:0;background:none;padding:9px 0;text-align:left;border-top:1px solid var(--line);width:100%}
.envpill:first-child{border-top:0}
.eic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.envpill .t{font-size:14.5px;font-weight:500;line-height:1.2}
.envpill .s{font-size:12.5px;color:var(--muted);line-height:1.25}
.envpill .s.crit{color:var(--crit)}
.envpill .a{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.envpill .p{font-size:12px;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:13px 14px;display:flex;flex-direction:column;gap:4px}
.tile .h{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.tile .h svg{width:18px;height:18px}
.tile .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.tile .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px}
.bars i{flex:1;border-radius:5px;background:var(--surface-2);transform-origin:bottom;animation:barup .6s var(--ease) both}
.bars i.today{background:var(--accent)}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.days{display:flex;gap:6px;font-size:11px;color:var(--muted)}
.days span{flex:1;text-align:center}

.list{display:flex;flex-direction:column}
.dayh{font-size:12.5px;color:var(--muted);font-weight:500;padding:10px 0 2px}
.dayh:first-child{padding-top:0}
.li{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;padding:9px 0}
.li .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em}
.li .t{font-size:14.5px;font-weight:500;line-height:1.25}
.li .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14.5px}
.amt.in{color:var(--ok)}.amt.out{color:var(--ink)}.amt.neg{color:var(--crit)}
.li.new{animation:newrow 1.6s var(--ease)}
@keyframes newrow{0%{background:var(--accent-soft)}100%{background:transparent}}

/* конверти */
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.split i{height:100%;transition:flex-grow .45s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.envgrid{display:flex;flex-direction:column;gap:8px}
.env{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;position:relative;transition:box-shadow .3s}
.env .top{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center}
.env .nm{font-size:14.5px;font-weight:500;line-height:1.2}
.env .gl{font-size:12.5px;color:var(--muted);line-height:1.25}
.env .gl.crit{color:var(--crit)}
.env b{font-size:16px;font-weight:600;text-align:right;white-space:nowrap}
.env .pc{display:block;font-size:12px;color:var(--muted);font-weight:400;text-align:right}
.bar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s var(--ease)}
.sub2{display:flex;gap:6px;font-size:12.5px;color:var(--muted)}
.sub2 span{flex:1;background:var(--surface-2);border-radius:9px;padding:6px 9px;line-height:1.25}
.sub2 b{display:block;font-size:13.5px;color:var(--ink);font-weight:600;text-align:left}
.env .plus{position:absolute;right:14px;top:-8px;font-size:12.5px;font-weight:600;color:var(--surface);background:var(--ok);border-radius:7px;padding:1px 6px;opacity:0}
.env.bump{box-shadow:0 0 0 2px var(--accent)}
.env.bump .plus{animation:plus 1.3s var(--ease)}
@keyframes plus{0%{opacity:0;transform:translateY(4px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.paybanner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--surface);animation:rise .35s var(--ease)}
.paybanner .coin{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.paybanner .t{font-size:12.5px;opacity:.7}
.paybanner b{font-size:18px;font-weight:600}
.flychip{position:absolute;left:0;top:0;z-index:40;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;color:#fff;pointer-events:none;white-space:nowrap}

/* радар */
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.scan{display:flex;align-items:center;gap:12px;padding:10px 0}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:none}
.alert-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.alert-card{border-left:3px solid var(--crit)}

/* шторки */
.sheet{position:absolute;inset:0;z-index:30;background:rgba(8,10,9,.36);display:flex;align-items:flex-end;animation:fade .2s both}
.sheet.closing{animation:fadeout .2s both}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.panel{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .32s var(--ease) both}
.sheet.closing .panel{animation:down .2s ease-in both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(30%);opacity:0}}
.panel.swap>*{animation:rise .25s var(--ease) both}
.grab{width:36px;height:5px;border-radius:99px;background:var(--line);align-self:center;margin-bottom:2px}
.panel h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.lbl{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.field input{font:inherit;font-size:22px;font-weight:600;color:var(--ink);background:var(--surface-2);border:0;border-radius:12px;padding:11px 13px;width:100%}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{border:0;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:4px 0;font-size:14.5px}
.prow .hint2{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.prow input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.prow .v{font-weight:600;font-variant-numeric:tabular-nums}
.pgroup{background:var(--surface-2);border-radius:12px;padding:8px 12px}
.pgroup .gh{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.taxline{font-size:13px;color:var(--muted)}
.selfline{display:flex;justify-content:space-between;font-weight:600}
.selfline.bad{color:var(--crit)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:500;text-align:right}
.stp{display:flex;gap:5px}
.stp i{flex:1;height:3px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.stp i.on::after{content:"";position:absolute;inset:0;background:var(--ink)}

<script>
(function(){
"use strict";
/* ======================================================================
   ДАНІ. Хардкод для MVP: дашборд, чеки, посилки. Справжнє: розподіл
   платежу по конвертах (тестовий WayForPay або імітація).
   ====================================================================== */
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('uk-UA')+' ₴';
const fmtn=n=>Math.round(n).toLocaleString('uk-UA');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WD=['нд','пн','вт','ср','чт','пт','сб'];
const today=new Date();today.setHours(0,0,0,0);
const dayAt=i=>{const d=new Date(today);d.setDate(d.getDate()+i);return d};
const dm=i=>{const d=dayAt(i);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')};
const wd=i=>WD[dayAt(i).getDay()];
const inDays=i=>i===0?'сьогодні':i===1?'завтра':`через ${i} ${i<5?'дні':'днів'}`;

/* «Витрати» = операційні (оренда, зарплата, тарифи) + маркетинг. Один баланс, частки задаються окремо */
const ENVS=[
  {k:'tax', n:'Податки',          c:'var(--c-tax)', l:'П', get goal(){return S.group==='12'?TAX12+ESV:TAX_Q3+3*ESV}, get gl(){return S.group==='12'?'щомісяця податок, ВЗ і ЄСВ':'до 19.11 · податок за квартал і ЄСВ'}},
  {k:'buy', n:'Закупівля',        c:'var(--c-buy)', l:'З', get goal(){return amtOf(EDIT(BUY))}, get gl(){return isOff('buy')?'закупівля товару':'партія постачальнику '+inDays(EDIT(BUY).d)}},
  {k:'exp', n:'Витрати',          c:'var(--c-exp)', l:'В', get goal(){return amtOf(OPS_PAYS[0])}, get gl(){return isOff('o0')?'регулярні платежі з виписки':'оренда '+fmt(amtOf(OPS_PAYS[0]))+' '+inDays(payDay(0))}},
  {k:'res', n:'Резерв',           c:'var(--c-res)', l:'Р', goal:60000, gl:'подушка на місяць'},
  {k:'self',n:'Собі',             c:'var(--c-self)',l:'С', goal:0,     gl:'вільні гроші'},
];
const ESV=1902.34, TAX_Q3=70200, TAX12=2594.10;   // ЄСВ за себе на місяць; податок за III квартал; 1–2 група: єдиний податок до 1 729,40 + військовий збір 864,70 на місяць
const SALES_DAY=13000;                       // середні продажі за день (8 тижнів історії)
const OPS_PAYS=[{id:'o0',d:2,t:'Оренда складу',a:40000},{id:'meta',d:10,t:'Реклама Meta',a:18000},{id:'o1',d:14,t:'Зарплата помічниці',a:15000},{id:'o2',d:19,t:'Тариф Prom.ua',a:4500}];   // платежі з «Витрат»
const BUY={id:'buy',d:13,t:'Партія постачальнику',a:52000};   // платіж із «Закупівлі»: лише в календарі, у прогноз «Витрат» не входить
/* правки платежів (вікно «Змінити платіж»): S.ed[id] = назва, дата, періодичність, реквізити; S.extra = додані платежі. Порожні = як у коді */
const EDIT=p=>({...p,...(S.ed&&S.ed[p.id])});
const EXPP=()=>[...OPS_PAYS,...(S.extra||[])].map(EDIT);   // платежі «Витрат»: j = індекс тут, видалені лишаються в списку, щоб індекси не зсувались
const payDay=(j,mv)=>{mv=mv||{};return mv[j]!=null?mv[j]:S.moved&&S.moved[j]!=null?S.moved[j]:EXPP()[j].d};   // платіж можна перенести на іншу дату
const REPS={w:'щотижня',m:'щомісяця',q:'щокварталу',o:'разово'};
const occ=(p,d0)=>{const r=[];for(let d=d0,k=0;d<30;d+=p.rep==='w'?7:99,k++)r.push({...p,id:k?p.id+'~'+k:p.id,d});return r};   // щотижневий платіж повторюється в межах 30 днів, id повторів «id~1», «id~2»
/* регулярні платежі «знайдено у виписці»: Олена відповідає так/ні, нову суму підтверджує (S.off, S.amt; порожні = як у DEF) */
const amtOf=p=>(S.amt&&S.amt[p.id])||p.a;
const isOff=id=>!!(S.off&&S.off[id]);
const isConn=n=>!(S.conn&&S.conn[n]===false);
const REGP=()=>[...EXPP().map((p,j)=>({...p,j})),EDIT(BUY)].filter(p=>!p.del);
const dayOf=p=>p.j!=null?payDay(p.j):p.d;
const REG_S={o0:'щомісяця',meta:'з картки ФОП',o1:'щомісяця',o2:'щомісяця',buy:'фабрика, регулярно'};
const regHTML=(off,edit)=>REGP().map(p=>`<label class="tgl regrow"><span><span class="t">${p.t}</span><span class="s">${fmt(amtOf(p))} · ${p.rep?REPS[p.rep]:REG_S[p.id]}${edit?' · '+dm(dayOf(p)):''}</span></span><input type="checkbox" data-reg="${p.id}"${off[p.id]?'':' checked'}><span class="sw"></span>${edit?`<button type="button" class="linkbtn" data-edit="${p.id}">Змінити</button>`:''}</label>`).join('');
const bindReg=(root,off,after)=>root.querySelectorAll('[data-reg]').forEach(i=>i.onchange=()=>{if(i.checked)delete off[i.dataset.reg];else off[i.dataset.reg]=true;if(after)after(i)});
const OD_RATE=.24, OD_SHARE=.30;             // умовні умови овердрафту

const DEF={
  group:'3', pct:{buy:50,ops:12,mkt:15,res:5},
  bal:{tax:51426,buy:38400,exp:28480,res:12000,self:6800},
  tx:[{src:'Checkbox',t:'Каса в магазині, 3 чеки',a:4180,ago:'сьогодні 12:40',day:0},{src:'NovaPay',t:'Кросівки «Ран», 41',a:3100,ago:'сьогодні 11:05',day:0},{src:'Нова пошта',t:'Післяплата, ТТН 2045…118',a:2800,ago:'сьогодні 09:52',day:0},{src:'LiqPay',t:'Лофери «Ліра», 37',a:2800,ago:'вчора 21:17',day:1}],
  od:0, debt:0, unalloc:0, autoRepay:true, done:{}, alert:false, notes:[], sysPush:false,
};
let S;
const load=()=>{try{const j=JSON.parse(localStorage.getItem('fk-state')||'null');if(!j)return null;
  if(j.v===4)return j.s;
  if(j.v===3){const s=j.s;s.bal.exp=(s.bal.ops||0)+(s.bal.mkt||0);delete s.bal.ops;delete s.bal.mkt;s.moved={};s.paid={};return s}   // старий формат: «Операційні» і «Маркетинг» зливаються у «Витрати»
}catch(e){}return null};
const save=()=>{try{localStorage.setItem('fk-state',JSON.stringify({v:4,s:S}))}catch(e){}};
S=load()||JSON.parse(JSON.stringify(DEF));
S.unalloc=S.unalloc||0;if(S.debt===undefined)S.debt=S.od||0;if(S.autoRepay===undefined)S.autoRepay=true;if(!S.notes)S.notes=[];

const taxPct=()=>S.group==='3'?6:S.group==='3v'?4:0;
const expPct=()=>S.pct.ops+S.pct.mkt;
const selfPct=()=>100-taxPct()-S.pct.buy-expPct()-S.pct.res;
const pctOf=k=>k==='tax'?taxPct():k==='self'?Math.max(0,selfPct()):k==='exp'?expPct():S.pct[k];
const total=()=>Object.values(S.bal).reduce((a,b)=>a+b,0)+(S.unalloc||0);   // усе, що лежить на рахунку ФОП: конверти + ще не розподілене
const taxOf=a=>Math.round(a*taxPct()/100);                                                // податок відкладається від повної суми надходження
const repayOf=a=>S.autoRepay?Math.min(S.debt||0,Math.round(a*OD_SHARE)):0;            // погашення овердрафту: 30% надходження, після податку і до поділу решти
const expSplit=v=>{const o=S.pct.ops,m=S.pct.mkt,t=o+m||1;return{ops:v*o/t,mkt:v*m/t}};

/* прогноз конверта «Витрати»: щодня приходить його частка продажів, виходять оренда, реклама, ЗП, тарифи
   x.add: докласти гроші зараз; x.debt: додати борг; x.move: перенести платіж; x.now: оплатити платіж сьогодні */
function forecast(x){x=x||{};
  const PL=EXPP().map((p,j)=>({...p,j,a:amtOf(p)})).filter(p=>!p.del&&!isOff(p.id)).flatMap(p=>occ(p,payDay(p.j,x.move))).map(p=>x.now===p.id?{...p,d:0}:p).filter(p=>!(S.paid&&S.paid[p.id]==='paid'));   // сплачене із застосунку вже списано з конверта
  const tp=taxPct()/100,k=expPct()/100/(1-tp);let debt=(S.debt||0)+(x.debt||0);const ua=S.unalloc||0,pend=ua-taxOf(ua)-repayOf(ua);debt-=repayOf(ua);
  let b=S.bal.exp+pend*k+(x.add||0);const days=[];let inflow0=null;
  for(let i=0;i<30;i++){const pays=PL.filter(p=>p.d===i);const low=b-pays.reduce((a,p)=>a+p.a,0);
    const rp=S.autoRepay?Math.min(debt,SALES_DAY*OD_SHARE):0;debt-=rp;const inflow=(SALES_DAY*(1-tp)-rp)*k;if(inflow0===null)inflow0=inflow;b=low+inflow;days.push({i,low,end:b,pays})}
  const g=days.find(d=>d.low<0);   // овердрафт береться рівно на дефіцит першого розриву (специфікація команди)
  return{days,gap:g?{i:g.i,need:-g.low,first:-g.low,pay:g.pays[0]}:null,inflow:inflow0};
}

/* ======================================================================
   ІКОНКИ + допоміжне
   ====================================================================== */
const IC={
 home:'<path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
 env:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 9h18"/><path d="M7 14h4"/>',
 radar:'<path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/>',
 ops:'<path d="M5 6h14M5 12h14M5 18h9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',

function chartSVG(f){
  const W=340,H=160,pl=34,pr=6,pt=10,pb=20,N=30,dx=(W-pl-pr)/N;
  const vs=[S.bal.exp];f.days.forEach(d=>vs.push(d.low,d.end));
  let mn=Math.min(0,...vs),mx=Math.max(...vs);const st=mx-mn>120000?40000:20000;mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
  const X=i=>pl+dx*i,Y=v=>pt+(H-pt-pb)*(mx-v)/(mx-mn),y0=Y(0);
  let d=`M${X(0)},${Y(vs[0])}`;f.days.forEach((x,i)=>{d+=`L${X(i).toFixed(1)},${Y(x.low).toFixed(1)}L${X(i+1).toFixed(1)},${Y(x.end).toFixed(1)}`});
  let grid='';for(let v=mn;v<=mx;v+=st)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${Y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${v/1000}k</text>`;
  let xt='';[0,7,14,21,28].forEach(i=>xt+=`<text x="${X(i)+dx/2}" y="${H-5}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${dm(i)}</text>`);
  const g=f.gap;const gm=g?`<circle cx="${X(g.i)}" cy="${Y(-g.first)}" r="4.5" fill="var(--crit)" stroke="var(--surface)" stroke-width="1.5"/><text x="${Math.min(X(g.i)+8,W-40)}" y="${Y(-g.first)+4}" font-size="10.5" font-weight="600" fill="var(--crit)">−${(Math.round(g.first/100)/10).toLocaleString('uk-UA')}k</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Прогноз залишку у Витратах на 30 днів"><defs><clipPath id="cp"><rect x="0" y="-10" width="${W}" height="${y0+10}"/></clipPath><clipPath id="cn"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath></defs>
   ${grid}<line x1="${pl}" x2="${W-pr}" y1="${y0}" y2="${y0}" stroke="var(--faint)"/>
   <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.8" clip-path="url(#cp)" pathLength="1" class="draw"/>
   <path d="${d}" fill="none" stroke="var(--crit)" stroke-width="1.8" clip-path="url(#cn)" pathLength="1" class="draw"/>${gm}${xt}</svg>`;
}

/* HMAC-MD5 (UTF-8). MD5 — RFC 1321 */
function md5bytes(bytes){
  const K=new Int32Array(64),r=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const len=bytes.length,nb=((len+8)>>>6)+1,w=new Int32Array(nb*16);
  for(let i=0;i<len;i++)w[i>>2]|=bytes[i]<<((i%4)*8);w[len>>2]|=0x80<<((len%4)*8);w[nb*16-2]=len*8;
  let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  for(let j=0;j<w.length;j+=16){let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){let F,g;if(i<16){F=(B&C)|(~B&D);g=i}else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}else if(i<48){F=B^C^D;g=(3*i+5)%16}else{F=C^(B|~D);g=(7*i)%16}
      const tmp=D;D=C;C=B;const x=(A+F+K[i]+w[j+g])|0;B=(B+((x<<r[i])|(x>>>(32-r[i]))))|0;A=tmp}
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0}
  const out=new Uint8Array(16);[a0,b0,c0,d0].forEach((v,i)=>{for(let k=0;k<4;k++)out[i*4+k]=(v>>>(k*8))&255});return out;
}
function hmacMD5(key,msg){const enc=new TextEncoder();let k=enc.encode(key);if(k.length>64)k=md5bytes(k);const kp=new Uint8Array(64);kp.set(k);
  const ip=kp.map(b=>b^0x36),op=kp.map(b=>b^0x5c),m=enc.encode(msg);
  const inner=md5bytes(new Uint8Array([...ip,...m]));const outer=md5bytes(new Uint8Array([...op,...inner]));return [...outer].map(b=>b.toString(16).padStart(2,'0')).join('')}
window.__hmacMD5=hmacMD5;

/* ---------- розрив без овердрафту: перекинути з конвертів або перенести платіж ---------- */
function transferPlan(){let X=0;for(let i=0;i<1000&&forecast({add:X}).gap;i++)X+=100;   // скільки треба докласти у «Витрати», щоб за 30 днів не було розриву
  const r=Math.min(X,S.bal.res),s=Math.min(X-r,S.bal.self);return{need:X,r,s,total:r+s,full:r+s>=X}}
function movePlan(g){const j=g.pay.j;for(let d=g.i+1;d<Math.min(30,g.i+15);d++){   // реалістично домовитись про перенесення максимум на 2 тижні
    const f=forecast({move:{[j]:d}});if(!f.gap||f.gap.i>d)return{j,d}}return null}

    <div class="small">${p.full?'Вистачить на всі платежі 30 днів.':p.total?`Цього мало: треба ${fmt(p.need)}. Решту можна взяти овердрафтом.`:`Треба ${fmt(p.need)}. Візьміть овердрафт або перенесіть платіж.`}</div>

  $('tr-cl').onclick=closeSheet;const go_=$('tr-go');if(go_)go_.onclick=()=>{S.bal.res-=p.r;S.bal.self-=p.s;S.bal.exp+=p.total;

function offerPay(pay){if(!pay)return;   // після перекидання одразу пропонуємо оплатити платіж, через який був розрив
  openSheet(`<svg class="success" viewBox="0 0 64 64" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28" pathLength="1"/><path d="M20 33l8 8 16-17" pathLength="1"/></svg>

  $('op-cl').onclick=closeSheet;$('op-go').onclick=()=>openBill(pay.id)}
function openMove(){const f=forecast();if(!f.gap)return;const g=f.gap,m=movePlan(g);

    <div class="btncol">${m?`<button class="btn" id="mv-go">Перенести на ${dm(m.d)}</button>`:''}<button class="btn ghost" id="mv-cl">${m?'Скасувати':'Зрозуміло'}</button></div>`,'Перенести платіж');
  $('mv-cl').onclick=closeSheet;const go_=$('mv-go');if(go_)go_.onclick=()=>{S.moved=S.moved||{};S.moved[m.j]=m.d;

function runRadar(){

/* ======================================================================
   СПОВІЩЕННЯ: банер усередині застосунку, системне сповіщення браузера
   (коли дозволено і вкладка не на екрані), центр сповіщень під дзвіночком
   ====================================================================== */
const ICON='icons/icon-192.png';
function addNote(kind,title,body){S.notes.unshift({kind,title,body,at:Date.now(),read:false});S.notes=S.notes.slice(0,20)}
function banner(title,body,go){
  const L=$('layer');const old=L.querySelector('.push');if(old)old.remove();
  const p=document.createElement('button');p.className='push';p.innerHTML=`<span class="pi"><img src="${ICON}" alt=""></span><span><span class="h"><span>ФІНАНСИСТ</span><span>зараз</span></span><span class="tt">${title}</span><span class="b">${body}</span></span>`;
  p.onclick=()=>{hidePush();if(go)go()};
  L.appendChild(p);setTimeout(hidePush,6500);
}
function hidePush(){const p=$('layer').querySelector('.push');if(p){p.classList.add('out');setTimeout(()=>p.remove(),280)}}
function sysNotify(title,body){   // справжнє сповіщення браузера; на iPhone працює тільки з головного екрана
  try{if(!S.sysPush||!('Notification' in window)||Notification.permission!=='granted')return;
    const o={body,icon:ICON,badge:ICON,tag:'fin-'+title};
    if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>new Notification(title,o));else new Notification(title,o)}catch(e){}}
function notify(kind,title,body,go,store){if(store!==false)addNote(kind,title,body);save();
  if(document.hidden)sysNotify(title,body);else banner(title,body,go);$('badge').hidden=false}
const NIC={gap:'warn',pay:'down',od:'bolt',bill:'bill',remind:'clock'};
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'щойно':m<60?m+' хв тому':Math.round(m/60)+' год тому'}
function openNotes(){S.notes.forEach(n=>n.read=true);save();$('badge').hidden=!S.alert;
  const f=forecast();
  openSheet(`<h3>Сповіщення</h3>
    ${f.gap&&S.alert?`<button class="ntf" id="n-gap"><span class="ni" style="background:var(--crit-soft);color:var(--crit)">${ic('warn')}</span><span><span class="t" style="display:block">Розрив ${dm(f.gap.i)}: бракує ${fmt(f.gap.need)}</span><span class="s" style="display:block">${f.gap.pay.t}. Натисніть, щоб закрити</span></span></button>`:''}
    <div>${S.notes.length?S.notes.map(n=>`<div class="ntf"><span class="ni">${ic(NIC[n.kind]||'bell')}</span><span><span class="t" style="display:block">${n.title}</span><span class="s" style="display:block">${n.body}</span><span class="w">${ago(n.at)}</span></span></div>`).join(''):'<div class="small" style="padding:8px 0">Поки тихо</div>'}</div>`,'Сповіщення');
  const g=$('n-gap');if(g)g.onclick=()=>{closeSheet();setTimeout(()=>{setTab('radar');setTimeout(runRadar,300)},220)}}
$('bell').onclick=openNotes;

/* нагадування про незавершену дію: якщо людина відволіклась (пішла з вкладки або нічого не робить 30 с) */
const reminded={};let idleT=0,hiddenT=0,leftWith=null,odLeft=false;
function pendingAction(){
  if(S.unalloc>0)return{k:'split',title:'Гроші чекають розподілу',body:`${fmt(S.unalloc)} ще не розкладено по конвертах`,go:()=>{setTab('env');setTimeout(()=>flash('c-pending'),300)}};
  if(odLeft&&forecast().gap)return{k:'od',title:'Овердрафт не оформлено',body:'Ви почали, але не підписали. Розрив досі відкритий',go:()=>{setTab('radar');setTimeout(runRadar,300)}};
  if(S.alert&&forecast().gap)return{k:'gap',title:'Розрив не закрито',body:'Оберіть: овердрафт, Резерв або перенести платіж',go:()=>{setTab('radar');setTimeout(runRadar,300)}};
  return null}
function remindNow(){if(auto||authEl)return;const a=pendingAction();if(!a||reminded[a.k]||sheetOpen())return;reminded[a.k]=true;addNote('remind',a.title,a.body);save();banner(a.title,a.body,a.go);$('badge').hidden=false}
function poke(){clearTimeout(idleT);idleT=setTimeout(remindNow,30000)}
['pointerdown','keydown','scroll'].forEach(ev=>addEventListener(ev,poke,{passive:true,capture:true}));poke();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){const a=pendingAction();leftWith=a;clearTimeout(hiddenT);if(a&&!auto&&!authEl)hiddenT=setTimeout(()=>{if(!reminded[a.k]){reminded[a.k]=true;addNote('remind',a.title,a.body);save();sysNotify(a.title,a.body)}},5000)}
  else{clearTimeout(hiddenT);const a=pendingAction();if(a&&leftWith&&a.k===leftWith.k&&!reminded[a.k]&&!auto&&!authEl&&!sheetOpen()){banner(a.title,a.body,a.go);reminded[a.k]=true}leftWith=null;poke()}});
function onSheetClosed(){if(od.step>=1&&od.step<4&&!od.finished)odLeft=true}

/* ---------- календар платежів: оплата прямо з застосунку (імітація) ---------- */

  {...b,i:b.d,e:'buy',a:amtOf(b)},

const envName=k=>ENVS.find(e=>e.k===k).n;
const billState=id=>S.paid&&S.paid[id];
function calHTML(f){f=f||forecast();return `<div class="card" id="c-cal"><div class="ct">Платежі<span class="sub">30 днів</span></div><div class="list">${CAL().map(p=>{const st=billState(p.id),low=p.j!=null&&st!=='paid'?f.days[p.i].low:null;

function bindBills(){document.querySelectorAll('[data-bill]').forEach(b=>b.onclick=()=>openBill(b.dataset.bill))}
const METHODS=[['card','Картка ФОП','•• 4610','#141614','VISA'],['bank','Рахунок ФОП','Райффайзен Банк','#C9A800','IBAN'],['liqpay','LiqPay','','#1B7A3E','LP'],['wfp','WayForPay','','#3A4FB8','WFP']];
function openBill(id){const p=CAL().find(x=>x.id===id);if(!p)return;const f=forecast();
  const enough=S.bal[p.e]>=p.a;
  const now=enough&&(p.j==null||!forecast({now:p.id}).gap);         // платимо одразу, якщо в конверті вистачає і це не відкриє розрив
  const gapBefore=p.j!=null&&f.gap&&f.gap.i<=p.i;                      // для «Витрат» дивимось прогноз
  const canSched=!now&&p.j!=null&&!gapBefore;                          // інакше плануємо на дату платежу
  const short=p.j!=null?(gapBefore?f.gap.need:0):p.a-S.bal[p.e];
  let m='card';
  openSheet(`<div class="lbl">${p.to||PAYEE[p.id.split('~')[0]]||'Отримувач'}</div><h3>${p.t} · ${fmt(p.a)}</h3>
    <div class="kv"><span>Дата</span><span>${wd(p.i)} ${dm(p.i)}</span><span>Конверт</span><span>${envName(p.e)} · ${fmt(S.bal[p.e])}</span>${p.iban?`<span>IBAN</span><span>${p.iban}</span>`:''}${p.note?`<span>Призначення</span><span>${p.note}</span>`:''}</div>
    ${now||canSched?`<div class="paym">${METHODS.map(([k,n,s,c,l])=>`<button class="pm" data-m="${k}" aria-pressed="${k===m}"><span class="pmi" style="background:${c}">${l}</span><span>${n}${s?`<span class="small" style="display:block">${s}</span>`:''}</span><span class="rd"></span></button>`).join('')}</div>
      <div class="btncol"><button class="btn" id="bl-go">${now?'Оплатити '+fmt(p.a):'Запланувати на '+dm(p.i)}</button><button class="btn ghost" id="bl-cl">Скасувати</button></div>
      ${canSched?`<p class="note">Сьогодні в конверті менше, ніж треба. Платіж піде ${dm(p.i)}, коли надходження його доповнять.</p>`:''}`
    :`<div class="hint crit">${p.j!=null?`${dm(p.i)} не вистачить ${fmt(short)}. Спершу закрийте розрив.`:`Не вистачає ${fmt(short)}. Конверт доповнюється з кожного надходження.`}</div>
      <div class="btncol">${p.j!=null?`<button class="btn crit" id="bl-gap">Закрити розрив</button>`:''}<button class="btn ghost" id="bl-cl">Зрозуміло</button></div>`}`,'Оплата');
  $('bl-cl').onclick=closeSheet;
  const gb=$('bl-gap');if(gb)gb.onclick=()=>{closeSheet();setTimeout(()=>{setTab('radar');setTimeout(runRadar,350)},250)};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const go_=$('bl-go');if(go_)go_.onclick=()=>{const mm=METHODS.find(x=>x[0]===m),mn=mm[1]+(mm[2]&&m==='card'?' '+mm[2]:'');go_.disabled=true;go_.innerHTML='<span class="spin" style="width:18px;height:18px;border-color:rgba(255,255,255,.3);border-top-color:#fff"></span>';
    setTimeout(()=>{S.paid=S.paid||{};if(now){S.paid[p.id]='paid';S.bal[p.e]-=p.a}else S.paid[p.id]='sched';
      addNote('bill',now?`Сплачено: ${p.t.toLowerCase()}`:`Заплановано: ${p.t.toLowerCase()}`,`${fmt(p.a)}, ${mn}${now?'':', '+dm(p.i)}`);save();closeSheet();if(tab!=='radar')setTab('radar');else render(false);
      toast(now?`Сплачено ${fmt(p.a)}`:`Заплановано на ${dm(p.i)}`);setTimeout(()=>flash('c-cal'),300)},RM?10:1100)}}

/* ---------- «Вивести собі»: безпечна межа за прогнозом (конверт «Собі» не блокується, лише попередження) ---------- */
function spendInfo(){const f=forecast();return{gap:f.gap,safe:f.gap?0:S.bal.self}}
function openWithdraw(){S.done.spend=true;save();paintSteps();
  const sp=spendInfo();
  const hcls=a=>a>S.bal.self?'hint crit':sp.gap?'hint':'hint ok';   // зелена, коли безпечно; бежева, коли не радимо; червона, коли стільки немає
  const hint=a=>a>S.bal.self?`У «Собі» лише ${fmt(S.bal.self)}`:sp.gap?`Не радимо: ${dm(sp.gap.i)} бракує ${fmt(sp.gap.need)} (${sp.gap.pay.t.toLowerCase()})`:'Безпечно: платежі на 30 днів покриті';
  openSheet(`<div class="lbl">З конверта «Собі» · ${fmt(S.bal.self)}</div><h3>Вивести собі</h3>
    <label class="field" for="wd-amt">Сума, ₴<input id="wd-amt" type="text" inputmode="numeric" autocomplete="off" value="${fmtn(S.bal.self)}"></label>
    <div class="${hcls(S.bal.self)}" id="wd-res">${hint(S.bal.self)}</div>
    <div class="btncol"><button class="btn" id="wd-ok">${sp.gap?'Вивести все одно':'Вивести'}</button><button class="btn ghost" id="wd-cl">Скасувати</button></div>`,'Вивести собі');
  const amt=()=>Math.max(0,parseAmt($('wd-amt').value));
  $('wd-amt').oninput=()=>{const i=$('wd-amt'),n=parseAmt(i.value);i.value=n?fmtn(n):'';const r=$('wd-res');r.innerHTML=hint(amt());r.className=hcls(amt())};
  $('wd-cl').onclick=closeSheet;
  $('wd-ok').onclick=()=>{const a=amt();if(!(a>0)||a>S.bal.self)return;S.bal.self-=a;save();closeSheet();render(false);toast('Виведено '+fmt(a))};
}

/* ---------- овердрафт: 4 кроки ---------- */
let od={};
function openOD(amt,g){od={amt,g,step:1};drawOD()}
function drawOD(){
  const days=odDays(od.amt),cost=od.amt*OD_RATE*days/365;
  const bar=`<div class="stp">${[1,2,3,4].map(i=>`<i class="${i<=od.step?'on':''}"></i>`).join('')}</div>`;let b='';
  if(od.step===1)b=`<div class="lbl">Овердрафт · Райффайзен Банк</div><div class="big num">${fmtn(od.amt)}<small>₴</small></div>
    <div class="small">${od.amt-od.g.need>=100?`Дефіцит ${fmt(od.g.need)} і погашення до ${dm(od.g.i)}`:`Рівно дефіцит на ${dm(od.g.i)}`}</div>
    <div class="kv"><span>Ставка</span><span>${OD_RATE*100}% річних</span><span>Погашення</span><span>${OD_SHARE*100}% з надходжень</span><span>Закриється за</span><span>≈ ${days} дн.</span><span>Переплата</span><span>≈ ${fmt(cost)}</span></div>
    <div class="btncol"><button class="btn" id="nx">Надіслати запит</button><button class="btn ghost" id="cl">Скасувати</button></div>
    <p class="note">Доступно, бо рахунок ФОП у Райффайзен Банку. Умови умовні.</p>`;
  if(od.step===2){S.done.bank=true;save()}
  if(od.step===2)b=`<div class="lbl">Райффайзен Банк</div><h3>Банк перевіряє дані</h3>
    <div class="checks" id="checks"><div><span class="c"></span>Обороти за 8 тижнів</div><div><span class="c"></span>Платежі без прострочок</div><div><span class="c"></span>Прогноз: борг закриється за ${days} дн.</div></div>`;
  if(od.step===3)b=`<div class="lbl">Схвалено</div><h3>Ліміт ${fmt(od.amt)}</h3>
    <div class="small">Підпишіть договір через Дія.Підпис. Гроші надійдуть одразу.</div>
    <div class="btncol"><button class="btn" id="nx">Підписати в Дії</button><button class="btn ghost" id="cl">Пізніше</button></div>`;
  if(od.step===4)b=`<svg class="success" viewBox="0 0 64 64" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28" pathLength="1"/><path d="M20 33l8 8 16-17" pathLength="1"/></svg>
    <h3 style="text-align:center">${fmt(od.amt)} у Витратах</h3><div class="small" style="text-align:center">${od.g.pay.t} ${dm(od.g.i)} покрито. Борг гаситься з надходжень ≈ ${days} дн.</div>
    <div class="btncol"><button class="btn" id="od-pay">${ic('card')}Оплатити ${od.g.pay.t.toLowerCase()}</button><button class="btn ghost" id="cl">Готово</button></div>`;
  openSheet(bar+b,'Перекрити розрив');
  const nx=$('nx'),cl=$('cl');if(nx)nx.onclick=()=>{od.step++;if(od.step===4)finishOD();drawOD()};const op=$('od-pay');if(op)op.onclick=()=>{closeSheet();render(false);setTimeout(()=>openBill(od.g.pay.id),250)};if(cl)cl.onclick=()=>{closeSheet();if(od.step===4)render(false)};
  if(od.step===2){[...document.querySelectorAll('#checks>div')].forEach((r,j)=>{sheetT.push(setTimeout(()=>r.classList.add('busy'),j*550));sheetT.push(setTimeout(()=>{r.classList.remove('busy');r.classList.add('done');r.querySelector('.c').innerHTML='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6l3 3 5-6"/></svg>'},j*550+480))});
    sheetT.push(setTimeout(()=>{od.step=3;drawOD()},2000))}
}
function finishOD(){S.bal.exp+=od.amt;S.od+=od.amt;S.debt=(S.debt||0)+od.amt;S.alert=false;S.done.gap=true;od.finished=true;odLeft=false;S.tx.unshift({src:'Raiffeisen',t:'Овердрафт у Витрати',a:od.amt,ago:'сьогодні '+new Date().toTimeString().slice(0,5),day:0,fresh:true});addNote('od','Овердрафт схвалено',`${fmt(od.amt)} у Витратах. ${od.g.pay.t} покрито`);save();paintSteps();$('badge').hidden=true}

/* ======================================================================
   СЦЕНАРІЙ ДЛЯ ЖУРІ
   ====================================================================== */
/* авто-показ: кроки в одному масиві, підписи в CAPS (чернетка), тривалості (d) у мс. «Авто» натискає справжні кнопки інтерфейсу */
let auto=false,di=-1,showT=[];
const later=(ms,fn)=>showT.push(setTimeout(fn,ms));
const clearTimers=()=>{showT.forEach(clearTimeout);showT=[]};

  if(step==='conn'){OB_CONN.forEach(([n])=>{if(ob.conn[n]===undefined)ob.conn[n]=false});   // спершу нічого не підключено, користувач підв'язує сам
    b=`<h2>Каси й еквайринг</h2><p>За бажанням. Тоді оплати видно одразу, ще до зарахування на рахунок.</p>
    <div class="obl">${OB_CONN.map(([n,t])=>`<div class="tgl regrow" style="cursor:default"><span style="display:flex;gap:10px;align-items:center">${srcIc(n)}<span><span class="t">${srcName(n)}</span><span class="s">${t}</span></span></span><span data-conn="${n}">${ob.conn[n]===false?`<button class="billbtn" style="margin:0" data-link="${n}">Підв'язати</button>`:'<span class="chip">підключено</span>'}</span></div>`).join('')}</div>
    <button class="btn" id="o-next">${OB_CONN.some(([n])=>ob.conn[n]!==false)?'Далі':'Пропустити'}</button>`}
  if(step==='push')b=`<h2>Сповіщення</h2><p>Попередимо про касовий розрив і нагадаємо про платежі. Стежити самій не треба.</p>
    ${'Notification' in window?`<div class="obl"><label class="tgl" style="padding:12px 0"><span>Сповіщення на телефон</span><input type="checkbox" id="o-push"${S.sysPush?' checked':''}><span class="sw"></span></label></div>`:''}
    <button class="btn" id="o-next">Готово</button>`;
  authEl.innerHTML=`<div class="authbox">${obBar({bank:3,consent:4,scan:6,found:6,pct:7,conn:8,push:9}[step])}${b}</div>`;authEl.scrollTop=0;
  const $a=id=>authEl.querySelector('#'+id),nx=$a('o-next'),sk=$a('o-skip');
  const NEXT={bank:'consent',found:'pct',pct:'conn',conn:'push'};
  if(nx)nx.onclick=()=>step==='push'?finishOnb():step==='consent'?openAuth('profile'):openOnb(NEXT[step]);
  if(step==='consent'){$a('o-back').onclick=()=>openOnb('bank');$a('o-file').onclick=()=>nx.click()}
  if(step==='scan'){[...authEl.querySelectorAll('#o-checks>div')].forEach((r,j)=>{obT.push(setTimeout(()=>r.classList.add('busy'),j*550));obT.push(setTimeout(()=>{r.classList.remove('busy');r.classList.add('done');r.querySelector('.c').innerHTML='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6l3 3 5-6"/></svg>'},j*550+480))});
    obT.push(setTimeout(()=>openOnb('found'),RM?10:2000))}
  if(step==='found'){bindReg(authEl,ob.off);authEl.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openPayEdit(b.dataset.edit))}
  if(step==='pct')sk.onclick=()=>nx.click();
  if(step==='conn')authEl.querySelectorAll('[data-link]').forEach(bt=>bt.onclick=()=>{const n=bt.dataset.link,slot=bt.parentNode;slot.innerHTML='<span class="spin" style="width:18px;height:18px"></span>';   // імітація входу в кабінет сервісу
    obT.push(setTimeout(()=>{if(!ob||!authEl)return;ob.conn[n]=true;slot.innerHTML='<span class="chip">підключено</span>';nx.textContent='Далі'},RM?10:900))});
  if(step==='push'){const p=$a('o-push');if(p)p.onchange=()=>askPush(p)}
  if(step==='push'&&'Notification' in window&&Notification.permission==='denied'){const pp=$a('o-push');if(pp)pp.closest('label').insertAdjacentHTML('afterend','<p class="note" style="padding:0 0 8px">Браузер заблокував сповіщення для цього сайту. Дозвольте їх у налаштуваннях сайту, тоді тумблер запрацює.</p>')}
}
function finishOnb(){S.off=ob.off;S.conn=ob.conn;ob=null;S.auth=true;finishAuth();setTab('home');setTimeout(()=>toast('Готово: дані з виписки підтягнуто'),300)}
async function askPush(pp){if(pp.checked){let r=Notification.permission;if(r==='default'){try{r=await Notification.requestPermission()}catch(e){}}S.sysPush=r==='granted';pp.checked=S.sysPush;save();toast(S.sysPush?'Сповіщення увімкнено':'Браузер не дозволив сповіщення')}else{S.sysPush=false;save()}}
function openProfile(){const p=S.profile||{};const g=(GROUPS.find(x=>x[0]===S.group)||['','—'])[1];
  const canPush='Notification' in window;
  openSheet(`<div class="profhead"><span class="avatar">${initials(p)}</span><div><h3 style="margin:0">${p.name||''} ${p.last||''}</h3><div class="small">ФОП · ${p.shop||''}</div></div></div>
   <div><div class="profrow"><span>Телефон</span><b>${prettyPhone(p.phone)}</b></div><div class="profrow"><span>Група</span><b>${g}</b></div><div class="profrow"><span>Рахунок</span><b>Райффайзен Банк</b></div><div class="profrow"><span>Тариф</span><b>Пробний · ще 14 днів</b></div>
   ${canPush?`<label class="tgl profrow" style="border-top:1px solid var(--line)"><span style="color:var(--ink)">Сповіщення на телефон</span><input type="checkbox" id="pf-push"${S.sysPush&&Notification.permission==='granted'?' checked':''}><span class="sw"></span></label>`:''}</div>
   <div class="btncol"><button class="btn ghost" id="pf-edit">Змінити дані</button><button class="btn ghost" id="pf-out" style="color:var(--crit)">Вийти</button></div>`,'Профіль');
  $('pf-edit').onclick=()=>{closeSheet();hidePush();openAuth('profile',true)};$('pf-out').onclick=logout;
  const pp=$('pf-push');if(pp)pp.onchange=()=>askPush(pp)}
document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=openProfile);
paintUser();

/* годинник у статус-барі рамки */
const tick=()=>{const d=new Date();$('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};tick();setInterval(tick,30000);

/* QR на цю сторінку */
addEventListener('load',()=>{try{if(window.QRCode&&/^https?:/.test(location.href))new QRCode($('qr'),{text:location.href.split('#')[0],width:74,height:74,colorDark:'#141614',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M});else $('qr').textContent=''}catch(e){}});

/* PWA */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&location.hostname!=='localhost')navigator.serviceWorker.register('sw.js').catch(()=>{});

S.done.dash=true;setTab('home');if(!S.auth)openAuth('phone');
})();
</script>
</body>
</html>
